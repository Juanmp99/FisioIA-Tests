<script>
// Guardia de acceso. Va aquí arriba, antes de cualquier contenido, para que
// quien llegue sin llave no llegue a ver la herramienta ni un instante.
(function () {
  var CLAVE = "fisioia.acceso";
  var delEnlace = new URLSearchParams(location.search).get("acceso");
  var guardado = null;
  try { guardado = localStorage.getItem(CLAVE); } catch (e) {}

  if (delEnlace) {
    // Aún sin verificar contra el servidor: lo hace el script principal.
    window.__accesoDelEnlace = delEnlace;
  } else if (!guardado) {
    location.replace("/?motivo=sin-acceso");
  }
})();
</script>

<style>
/* ============================================================================
   Sistema visual
   ----------------------------------------------------------------------------
   Una regla gobierna todo el color: aquí no decora, significa. El verde dice
   que un resultado decide, el ámbar que mueve sin decidir, el gris que no
   aporta nada. Si un color no significa algo, es gris.

   La segunda regla es de jerarquía: lo que el fisioterapeuta tiene que leer
   para decidir —qué cambia este resultado en su paciente— manda sobre todo lo
   demás. El resto es contexto y se comporta como tal.
   ============================================================================ */

:root {
  --fondo: #070a11;
  --superficie: #0d1320;
  --superficie-alta: #121a29;
  --superficie-viva: #182234;
  --borde: #1c2637;
  --borde-vivo: #2b3a52;

  --tinta: #e9eff8;
  --tinta-media: #a3b2c9;
  --tinta-tenue: #66758d;

  --azul: #4d9fff;
  --azul-hondo: #1f6fd6;
  --verde: #2fd6a6;
  --ambar: #f5b544;
  --rojo: #ff6f61;
  --violeta: #a78bfa;

  --brillo-azul: rgba(77, 159, 255, .14);
  --brillo-verde: rgba(47, 214, 166, .13);
  --brillo-ambar: rgba(245, 181, 68, .12);
  --brillo-rojo: rgba(255, 111, 97, .12);

  --radio: 16px;
  --radio-s: 10px;
  --sombra: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -24px rgba(0,0,0,.9);
  --curva: cubic-bezier(.16, 1, .3, 1);

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

:root[data-tema="claro"],
html:not([data-tema="oscuro"]) body.claro {
  --fondo: #f4f7fc;
}

@media (prefers-color-scheme: light) {
  :root:not([data-tema="oscuro"]) {
    --fondo: #f2f6fc;
    --superficie: #ffffff;
    --superficie-alta: #ffffff;
    --superficie-viva: #f2f6fd;
    --borde: #dde5f0;
    --borde-vivo: #c4d2e6;

    --tinta: #0c1626;
    --tinta-media: #44566f;
    --tinta-tenue: #6b7c94;

    --azul: #1668d6;
    --azul-hondo: #0d4ea8;
    --verde: #0f9a74;
    --ambar: #b57314;
    --rojo: #c8382b;
    --violeta: #7048d6;

    --brillo-azul: rgba(22, 104, 214, .08);
    --brillo-verde: rgba(15, 154, 116, .09);
    --brillo-ambar: rgba(181, 115, 20, .09);
    --brillo-rojo: rgba(200, 56, 43, .08);

    --sombra: 0 1px 2px rgba(16, 34, 61, .05), 0 16px 36px -26px rgba(16, 34, 61, .4);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

/* Profundidad del fondo: dos focos de luz muy tenues que evitan que la pantalla
   sea un plano liso. Fijos, para que no compitan con el contenido al desplazar. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(70% 50% at 15% -5%, var(--brillo-azul) 0%, transparent 70%),
    radial-gradient(60% 45% at 100% 8%, rgba(167, 139, 250, .09) 0%, transparent 70%);
}

.marco { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px 60px; transition: max-width .6s var(--curva); }
/* Con la batería en pantalla conviven el carril, la línea de las fases y la
   tarjeta, y en 860 px la tarjeta se estrechaba hasta partir su fila de botones. */
.marco:has(.trabajo:not([hidden]):not(.sin-carril)) { max-width: 1060px; }

a { color: var(--azul); text-underline-offset: 3px; }

/* ============ barra superior ============ */

.barra {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 24px;
  background: color-mix(in srgb, var(--fondo) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--borde);
}

.marca { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marca b { font-size: 1.0625rem; font-weight: 800; letter-spacing: -.03em; }
.marca b span { color: var(--verde); }
.marca em {
  font-style: normal; font-size: .8125rem; color: var(--tinta-tenue);
  padding-left: 10px; border-left: 1px solid var(--borde-vivo);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.estado-modelo {
  font-family: var(--mono); font-size: .6875rem; color: var(--tinta-tenue);
  white-space: nowrap;
}

/* ============ consulta ============ */

/* ============ el lanzador ============ */

/* Aquí dentro ya no se vende nada: convencer es trabajo de la landing, y esta
   pantalla se ve todas las veces mientras que aquella se ve una. Lo que queda
   es el campo, centrado como un instrumento que se abre. */
.consulta {
  min-height: calc(100vh - 190px);
  display: flex; flex-direction: column; justify-content: center;
  padding: 30px 0;
  animation: entrar .6s var(--curva) both;
}

/* Al buscar deja de ser portada y se aparta: el trabajo pasa a ser lo de abajo. */
.consulta.compacta {
  min-height: 0; display: block; padding: 28px 0 6px;
  animation: none;
}
.consulta.compacta h1 { font-size: 1.5rem; margin-bottom: 14px; }

.consulta h1 {
  margin: 0 0 20px;
  font-size: clamp(2.2rem, 6vw, 3.25rem); line-height: 1.05;
  letter-spacing: -.04em; font-weight: 800;
  transition: font-size .4s var(--curva);
}

.rotulo {
  display: inline-block;
  font-size: .6875rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--tinta-tenue);
}

.buscador { display: flex; gap: 10px; flex-wrap: wrap; }

.buscador input {
  flex: 1 1 320px; min-width: 0;
  background: var(--superficie); color: var(--tinta);
  border: 1px solid var(--borde-vivo); border-radius: 14px;
  padding: 18px 20px; font: inherit; font-size: 1.0625rem;
  transition: border-color .2s, box-shadow .2s;
}
.buscador input::placeholder { color: var(--tinta-tenue); }
.buscador input:focus {
  outline: 0; border-color: var(--azul);
  box-shadow: 0 0 0 4px var(--brillo-azul);
}

.btn {
  border: 0; border-radius: 14px; font: inherit; font-weight: 650;
  padding: 18px 28px; cursor: pointer;
  transition: transform .15s var(--curva), filter .2s, background .2s;
}
.btn:active { transform: scale(.98); }
.btn-principal {
  background: linear-gradient(180deg, var(--azul) 0%, var(--azul-hondo) 100%);
  color: #fff; box-shadow: 0 6px 20px -8px var(--azul);
}
.btn-principal:hover:not(:disabled) { filter: brightness(1.08); }
.btn-principal:disabled { opacity: .55; cursor: default; }

/* ============ últimas consultas ============ */

/* Guardadas en el navegador y solo ahí. Saber qué patologías consulta un
   fisioterapeuta es un dato con carga sanitaria, y no hay motivo para que salga
   de su dispositivo: repetir una consulta suya sale además de la caché. */
.recientes { margin-top: 26px; }
.recientes-lista { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
.reciente {
  background: none; border: 1px solid var(--borde); border-radius: 999px;
  padding: 8px 15px; font: inherit; font-size: .875rem; color: var(--tinta-tenue);
  cursor: pointer; transition: all .18s var(--curva);
}
.reciente:hover { color: var(--azul); border-color: var(--azul); background: var(--brillo-azul); }

/* ============ tira de sugerencias ============ */

/* Desfila como un panel de salidas, pero se para al acercarse y desaparece en
   cuanto hay resultados en pantalla: es un elemento de bienvenida, no algo que
   deba seguir moviéndose mientras se trabaja. */
.tira { margin: 22px 0 0; }
.tira-rotulo { display: block; margin-bottom: 10px; }

.tira-pista {
  overflow: hidden;
  /* Aire para que el chip quepa entero al levantarse: sin esto, overflow
     hidden le corta los dos píxeles que sube al pasar el ratón. */
  padding: 8px 0;
  margin: -8px 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 92%, transparent);
}

.tira-cinta {
  display: flex; gap: 10px; width: max-content;
  animation: desfilar 66s linear infinite;
}
.tira-pista:hover .tira-cinta,
.tira-cinta:focus-within { animation-play-state: paused; }

.sugerencia {
  flex: none;
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: 999px; padding: 9px 17px;
  font: inherit; font-size: .875rem; color: var(--tinta-media);
  white-space: nowrap; cursor: pointer;
  transition: color .18s, border-color .18s, background .18s, transform .18s var(--curva);
}
.sugerencia:hover {
  color: var(--azul); border-color: var(--azul);
  background: var(--brillo-azul); transform: translateY(-2px);
}

/* ============ el carril de pasos ============ */

/* Los tres pasos no son un invento de diseño: son el razonamiento clínico.
   Con cuánta sospecha llegas, qué encuentras, qué concluyes. Ponerlo a la vista
   ordena la pantalla y, de paso, enseña a pensar.
   Nunca bloquea: se puede marcar un resultado antes de fijar la sospecha
   previa, y la herramienta lo permite a propósito. Esto informa, no cierra. */

.trabajo { display: grid; grid-template-columns: 232px 1fr; gap: 38px; align-items: start; }
/* Como en el panel de la ficha: el atributo hidden pone display:none desde la
   hoja del navegador y cualquier display propio lo gana. */
.trabajo[hidden] { display: none; }
/* Mientras no hay batería —buscando, o una sospecha ambigua— no hay pasos que
   enseñar, y el hueco del carril sobra. */
.trabajo.sin-carril { grid-template-columns: 1fr; gap: 0; }
.trabajo.sin-carril .carril { display: none; }

.carril { position: sticky; top: 74px; }

.alerta-banderas {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left; font: inherit; font-size: .8125rem; font-weight: 600;
  color: var(--rojo); background: var(--brillo-rojo);
  border: 1px solid color-mix(in srgb, var(--rojo) 35%, transparent);
  border-radius: 11px; padding: 11px 13px; margin-bottom: 18px; cursor: pointer;
  transition: border-color .2s;
}
.alerta-banderas:hover { border-color: var(--rojo); }
.alerta-banderas::before {
  content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%;
  background: var(--rojo); box-shadow: 0 0 0 4px var(--brillo-rojo);
  animation: latir 2.4s ease-in-out infinite;
}

.pasos { list-style: none; margin: 0; padding: 0; position: relative; }

.paso-carril {
  position: relative; display: flex; gap: 14px; align-items: flex-start;
  padding: 0 0 26px; cursor: pointer;
  background: none; border: 0; font: inherit; text-align: left; width: 100%;
  color: var(--tinta-tenue);
}
.paso-carril:last-child { padding-bottom: 0; }

/* El hilo que une los pasos. Se rellena a medida que se avanza. */
.paso-carril:not(:last-child)::before {
  content: ""; position: absolute; left: 15px; top: 32px; bottom: 6px; width: 2px;
  background: var(--borde);
}
/* Azul y no verde: en esta herramienta el verde es "evidencia sólida", y un paso
   completado no dice nada de la evidencia. */
.paso-carril:not(:last-child).hecho::before {
  background: linear-gradient(180deg, var(--azul), color-mix(in srgb, var(--azul) 30%, var(--borde)));
}

.paso-num {
  flex: none; position: relative; z-index: 1;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--superficie); border: 2px solid var(--borde);
  font-family: var(--mono); font-size: .8125rem; font-weight: 700;
  transition: all .35s var(--curva);
}

.paso-carril.activo .paso-num {
  border-color: var(--azul); color: var(--azul);
  box-shadow: 0 0 0 5px var(--brillo-azul), 0 0 20px -4px var(--azul);
}
.paso-carril.hecho .paso-num {
  border-color: var(--azul); background: var(--azul); color: var(--fondo);
}
.paso-carril.hecho .paso-num span { display: none; }
.paso-carril.hecho .paso-num::after {
  content: ""; width: 11px; height: 6px; margin-top: -3px;
  border-left: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor;
  transform: rotate(-45deg);
  /* Con la animación genérica de entrada se perdía la rotación: anima el
     transform entero y se comía el rotate. Necesita la suya. */
  animation: aparecerTic .35s var(--curva) both;
}

.paso-texto { padding-top: 4px; min-width: 0; }
.paso-texto b { display: block; font-size: .9375rem; font-weight: 650; color: var(--tinta-media); transition: color .3s; }
.paso-carril.activo .paso-texto b, .paso-carril.hecho .paso-texto b { color: var(--tinta); }
.paso-valor {
  display: block; font-family: var(--mono); font-size: .75rem; margin-top: 3px;
  color: var(--tinta-tenue); font-variant-numeric: tabular-nums;
}
.paso-carril.hecho .paso-valor { color: var(--tinta-media); }
.paso-carril.activo .paso-valor { color: var(--azul); }

/* Lo que falta por hacer, invitando en vez de alarmando. */
.paso-carril.pendiente .paso-num { border-color: var(--azul); color: var(--azul); }
.paso-carril.pendiente .paso-valor { color: var(--azul); animation: respirar 2.2s ease-in-out infinite; }

.paso-detalle {
  display: block; font-size: .75rem; margin-top: 3px; color: var(--tinta-tenue);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

@media (max-width: 860px) {
  /* En un móvil no hay ancho para un carril lateral: pasa a ser una barra fina
     pegada arriba, con los tres pasos en horizontal. */
  .trabajo { grid-template-columns: 1fr; gap: 0; }
  .carril {
    top: 58px; z-index: 30; margin: 0 -20px 18px; padding: 12px 20px;
    background: color-mix(in srgb, var(--fondo) 90%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--borde);
  }
  .pasos { display: flex; gap: 8px; }
  .paso-carril { flex: 1; flex-direction: column; gap: 7px; padding: 0; align-items: flex-start; }
  .paso-carril:not(:last-child)::before {
    left: 34px; right: 8px; top: 15px; bottom: auto; width: auto; height: 2px;
  }
  .paso-num { width: 28px; height: 28px; font-size: .75rem; }
  .paso-texto { padding-top: 0; }
  .paso-texto b { font-size: .8125rem; }
  .paso-valor { font-size: .6875rem; }
  .paso-detalle { display: none; }
  .alerta-banderas { margin-bottom: 12px; }
}

/* ============ piezas comunes ============ */

.seccion { margin-top: 30px; animation: entrar .5s var(--curva) both; }

.tarjeta {
  background: linear-gradient(180deg, var(--superficie-alta) 0%, var(--superficie) 100%);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 22px 24px;
}

.aviso {
  border-left: 3px solid var(--azul);
  background: var(--brillo-azul);
  border-radius: 0 var(--radio-s) var(--radio-s) 0;
  padding: 14px 16px; color: var(--tinta-media);
}
.aviso.malo { border-left-color: var(--rojo); background: var(--brillo-rojo); }

.opciones { display: grid; gap: 10px; }
.opcion {
  display: block; width: 100%; text-align: left;
  background: var(--superficie-alta); border: 1px solid var(--borde);
  border-radius: var(--radio-s); padding: 16px 18px; font: inherit; color: var(--tinta);
  cursor: pointer; transition: border-color .2s, transform .15s var(--curva), background .2s;
}
.opcion:hover { border-color: var(--azul); transform: translateX(3px); background: var(--superficie-viva); }
.opcion b { display: block; }
.opcion span { display: block; font-size: .875rem; color: var(--tinta-tenue); margin-top: 3px; }

/* ============ banderas rojas ============ */

/* Cada bandera es una tarjeta con el color de su urgencia. Aquí el color no
   adorna: separa lo que manda a urgencias hoy de lo que exige derivar antes de
   tratar. Es lo único de la herramienta con consecuencias inmediatas. */
.bandera {
  border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
  border: 1px solid var(--borde); background: var(--superficie);
  border-left-width: 4px;
}
.bandera.urgente {
  border-color: color-mix(in srgb, var(--rojo) 40%, var(--borde));
  border-left-color: var(--rojo);
  background: linear-gradient(100deg, var(--brillo-rojo), transparent 65%), var(--superficie);
}
.bandera.prioritaria {
  border-color: color-mix(in srgb, var(--ambar) 38%, var(--borde));
  border-left-color: var(--ambar);
  background: linear-gradient(100deg, var(--brillo-ambar), transparent 65%), var(--superficie);
}

.bandera-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin-bottom: 12px; }
.bandera h4 {
  margin: 0; font-size: 1.125rem; font-weight: 720; letter-spacing: -.02em; color: var(--tinta);
}

.prioridad {
  font-size: .625rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
  padding: 5px 10px; border-radius: 999px;
  background: var(--brillo-ambar); color: var(--ambar);
  border: 1px solid color-mix(in srgb, var(--ambar) 40%, transparent);
}
.prioridad.urgente {
  background: var(--brillo-rojo); color: var(--rojo);
  border-color: color-mix(in srgb, var(--rojo) 45%, transparent);
  animation: latir 2.2s ease-in-out infinite;
}

.bandera ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.bandera li {
  position: relative; padding-left: 20px;
  font-size: .9375rem; color: var(--tinta-media);
}
.bandera li::before {
  content: ""; position: absolute; left: 0; top: .6em;
  width: 8px; height: 2px; border-radius: 2px; background: var(--ambar);
}
.bandera.urgente li::before { background: var(--rojo); }

.bandera-accion {
  margin: 14px 0 0; padding: 12px 14px;
  border-radius: 10px; background: var(--superficie-viva);
  font-size: .9375rem; font-weight: 600; color: var(--tinta);
  display: flex; gap: 10px; align-items: flex-start;
}
.bandera-accion::before { content: "→"; flex: none; color: var(--ambar); font-weight: 700; }
.bandera.urgente .bandera-accion::before { color: var(--rojo); }

.advertencia {
  font-size: .8125rem; color: var(--tinta-tenue); padding: 16px 0 0; margin: 4px 0 0;
  border-top: 1px solid var(--borde);
}

/* ============ las tres fases ============ */

/* Tres capítulos unidos por una línea. Un solo acento, el azul, que se enciende
   en la fase activa y rellena la línea al completarla: el progreso se entiende
   sin leer nada. Nada aquí bloquea un clic ni retrasa al fisioterapeuta. */

.fases { position: relative; padding-bottom: 8px; }

.fase {
  --sangria: 66px;
  position: relative;
  padding-left: var(--sangria);
  margin-top: 56px;
  /* Al saltar desde el carril, la cabecera quedaba debajo de la barra fija. */
  scroll-margin-top: 96px;
}
.fase:first-child { margin-top: 30px; }

/* La línea que une una fase con la siguiente: el raíl, y encima su relleno. */
.fase::before,
.fase::after {
  content: ""; position: absolute;
  left: 21px; top: 50px; bottom: -58px; width: 2px;
  border-radius: 2px;
}
.fase::before { background: var(--borde); }
.fase::after {
  background: linear-gradient(180deg, var(--azul) 0%, color-mix(in srgb, var(--azul) 40%, transparent) 100%);
  box-shadow: 0 0 14px color-mix(in srgb, var(--azul) 55%, transparent);
  transform: scaleY(0); transform-origin: top;
  transition: transform 1.1s var(--curva);
}
.fase.fase-hecha::after { transform: scaleY(1); }
.fase:last-child::before,
.fase:last-child::after { display: none; }

/* ---- cabecera ---- */

.fase-cab {
  position: relative;
  display: flex; align-items: center; gap: 18px;
  margin: 0 0 24px calc(var(--sangria) * -1);
  padding-bottom: 20px;
  opacity: 0; transform: translateY(22px);
  transition: opacity .8s var(--curva), transform .8s var(--curva);
}
.fase-cab.revelada { opacity: 1; transform: none; }
.fase-2 .fase-cab { transition-delay: .08s; }

/* El número de la fase, enorme y casi invisible, detrás del titular. */
.fase-cab::before {
  content: attr(data-num);
  position: absolute; right: 150px; top: -40px; z-index: 0;
  font-family: var(--mono); font-size: 7.5rem; font-weight: 800; line-height: 1;
  letter-spacing: -.08em; pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--azul) 26%, transparent), transparent 78%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: .35; transition: opacity .6s var(--curva);
}
.fase-activa .fase-cab::before { opacity: 1; }

.fase-nodo {
  flex: none; position: relative; z-index: 1;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--fondo);
  border: 2px solid var(--borde-vivo);
  font-family: var(--mono); font-size: 1rem; font-weight: 800; color: var(--tinta-tenue);
  transition: border-color .5s var(--curva), background .5s var(--curva), color .5s var(--curva), box-shadow .5s var(--curva);
}
.fase-activa .fase-nodo {
  border-color: var(--azul); color: var(--azul);
  background: color-mix(in srgb, var(--azul) 10%, var(--fondo));
  box-shadow: 0 0 0 6px var(--brillo-azul), 0 0 32px -6px var(--azul);
}
/* La onda de la fase activa: dice "aquí" sin necesidad de leerlo. */
.fase-activa .fase-nodo::after {
  content: ""; position: absolute; inset: -2px; border-radius: 50%;
  border: 1.5px solid var(--azul);
  animation: onda 2.8s var(--curva) infinite;
}
.fase-hecha .fase-nodo {
  border-color: var(--azul); background: var(--azul); color: var(--fondo);
  box-shadow: 0 0 26px -8px var(--azul);
}
.nodo-tic { width: 20px; height: 20px; }
.nodo-tic path {
  fill: none; stroke: var(--fondo); stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round;
}
.nodo-tic.trazando path {
  stroke-dasharray: 22; stroke-dashoffset: 22;
  animation: trazar .55s .25s var(--curva) forwards;
}

.fase-titulos { position: relative; z-index: 1; flex: 1; min-width: 0; }

.fase-eyebrow {
  display: block;
  font-size: .6875rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase;
  color: var(--tinta-tenue); transition: color .5s var(--curva);
}
.fase-de { opacity: .55; }
.fase-activa .fase-eyebrow { color: var(--azul); }

.fase-titulo {
  margin: 5px 0 0;
  font-size: clamp(1.75rem, 4.6vw, 2.5rem); font-weight: 800;
  letter-spacing: -.05em; line-height: 1.02;
  color: var(--tinta-tenue);
  transition: opacity .5s var(--curva);
}
/* La activa es la única con el titular a pleno contraste: es lo que dice dónde
   estás. La completada se aparta un paso atrás, la pendiente dos. */
.fase-activa .fase-titulo {
  background: linear-gradient(115deg, var(--tinta) 30%, color-mix(in srgb, var(--azul) 70%, var(--tinta)) 110%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.fase-hecha .fase-titulo { color: var(--tinta-media); }
.fase-pendiente .fase-titulo { opacity: .7; }

.fase-sub {
  display: block; margin-top: 6px;
  font-size: .9375rem; color: var(--tinta-tenue);
}

.fase-valor {
  position: relative; z-index: 1; flex: none; align-self: center;
  font-family: var(--mono); font-size: .8125rem; font-variant-numeric: tabular-nums;
  padding: 7px 14px; border-radius: 999px; white-space: nowrap;
  color: var(--tinta-tenue); background: var(--superficie);
  border: 1px solid var(--borde);
  transition: color .4s var(--curva), background .4s var(--curva), border-color .4s var(--curva);
}
.fase-activa .fase-valor {
  color: var(--azul); background: var(--brillo-azul);
  border-color: color-mix(in srgb, var(--azul) 40%, transparent);
}
.fase-hecha .fase-valor { color: var(--tinta); border-color: var(--borde-vivo); }
.fase-valor.cambia { animation: latido .6s var(--curva); }

/* La raya bajo el titular: se traza de izquierda a derecha al revelarse. */
.fase-raya {
  position: absolute; left: var(--sangria); right: 0; bottom: 0; height: 1px;
  background: linear-gradient(90deg, var(--borde-vivo), transparent 85%);
  transform: scaleX(0); transform-origin: left;
  transition: transform 1s .2s var(--curva);
}
.fase-activa .fase-raya { background: linear-gradient(90deg, color-mix(in srgb, var(--azul) 70%, transparent), transparent 85%); }
.fase-cab.revelada .fase-raya { transform: scaleX(1); }

.fase-cuerpo { position: relative; }

/* ---- fase 1 recogida ---- */

.fase-resumen {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 16px 20px; border-radius: var(--radio);
  background:
    linear-gradient(90deg, var(--brillo-azul), transparent 70%),
    var(--superficie);
  border: 1px solid color-mix(in srgb, var(--azul) 25%, var(--borde));
}
.fase-resumen.entra { animation: recoger .55s var(--curva) both; }
.fase-resumen-texto { flex: 1; min-width: 220px; color: var(--tinta-media); font-size: 1rem; }
.fase-resumen-texto b { color: var(--tinta); font-weight: 700; }
.fase-resumen-texto i {
  font-style: normal; font-family: var(--mono); font-size: .8125rem;
  color: var(--azul); margin-left: 10px; white-space: nowrap;
}
.btn-cambiar {
  font: inherit; font-size: .8125rem; font-weight: 650; cursor: pointer;
  color: var(--azul); background: none;
  border: 1px solid color-mix(in srgb, var(--azul) 40%, transparent);
  border-radius: 999px; padding: 7px 16px;
  transition: background .2s, border-color .2s, transform .15s var(--curva);
}
.btn-cambiar:hover { background: var(--brillo-azul); border-color: var(--azul); transform: translateY(-1px); }
.tarjeta.pretest.entra { animation: entrar .5s var(--curva) both; }

/* ---- fase 3 ---- */

.fase-vacia {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 22px 24px; border-radius: var(--radio);
  border: 1px dashed var(--borde-vivo);
  color: var(--tinta-tenue);
}
.fase-vacia b { display: block; color: var(--tinta-media); font-weight: 650; }
.fase-vacia p { margin: 4px 0 0; font-size: .9375rem; max-width: 52ch; }
.fase-vacia-icono {
  flex: none; width: 36px; height: 36px; border-radius: 50%;
  border: 2px dashed var(--borde-vivo);
  animation: girar 14s linear infinite;
}

/* La llegada de la conclusión: el final del recorrido tiene que sentirse como
   tal. Solo la primera vez; después se queda quieta mientras se marca. */
.fase-3 .conclusion { margin-top: 0; }
.conclusion.ya { animation: none; }
.conclusion.llega { animation: llegada .9s var(--curva) both; }
.conclusion.llega .conclusion-dentro { position: relative; overflow: hidden; }
.conclusion.llega .conclusion-dentro::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, color-mix(in srgb, var(--azul) 16%, transparent) 50%, transparent 65%);
  transform: translateX(-100%);
  animation: barrido 1.4s .35s var(--curva) both;
}
.fase-3.fase-activa .conclusion,
.fase-3.fase-hecha .conclusion {
  box-shadow: 0 30px 70px -40px color-mix(in srgb, var(--azul) 60%, transparent);
}

@media (max-width: 620px) {
  /* En móvil el carril es una barra pegada arriba, así que hace falta más margen. */
  .fase { --sangria: 0px; margin-top: 44px; scroll-margin-top: 150px; }
  .fase::before, .fase::after { display: none; }
  .fase-cab { gap: 14px; margin-left: 0; }
  .fase-cab::before { font-size: 5rem; top: -22px; right: 0; }
  .fase-nodo { width: 38px; height: 38px; font-size: .9375rem; }
  .fase-valor { display: none; }
  .fase-raya { left: 0; }
  .fase-sub { font-size: .875rem; }
}

/* ============ sospecha previa ============ */

.pretest h3 { margin: 0 0 6px; font-size: 1.0625rem; letter-spacing: -.01em; }
.pretest p { margin: 0 0 18px; color: var(--tinta-media); font-size: .9375rem; max-width: 58ch; }

.niveles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.nivel {
  position: relative; overflow: hidden;
  background: var(--superficie-viva); border: 1px solid var(--borde);
  border-radius: var(--radio-s); padding: 14px 12px; cursor: pointer;
  font: inherit; color: var(--tinta); text-align: left;
  transition: border-color .2s, background .2s, transform .15s var(--curva);
}
.nivel:hover { border-color: var(--borde-vivo); transform: translateY(-2px); }
.nivel b { display: block; font-size: .9375rem; }
.nivel span { display: block; font-size: .75rem; color: var(--tinta-tenue); font-family: var(--mono); }
.nivel[aria-pressed="true"] {
  border-color: var(--azul); background: var(--brillo-azul);
  box-shadow: 0 0 0 1px var(--azul) inset;
}
.nivel[aria-pressed="true"] span { color: var(--azul); }

/* ============ medidor de probabilidad ============ */

.medidor { margin: 14px 0 2px; }

.pista {
  position: relative; height: 10px; border-radius: 999px;
  background: var(--superficie-viva);
  border: 1px solid var(--borde);
  overflow: visible;
}

.zona { position: absolute; top: 0; bottom: 0; }
.zona-descarta { left: 0; width: 10%; background: linear-gradient(90deg, var(--brillo-verde), transparent); border-radius: 999px 0 0 999px; }
.zona-confirma { right: 0; width: 15%; background: linear-gradient(270deg, var(--brillo-verde), transparent); border-radius: 0 999px 999px 0; }

.recorrido {
  position: absolute; top: 0; bottom: 0; border-radius: 999px;
  animation: barrer .85s var(--curva) both;
}
.recorrido.sube { background: linear-gradient(90deg, transparent, var(--verde)); transform-origin: left center; }
.recorrido.baja { background: linear-gradient(270deg, transparent, var(--azul)); transform-origin: right center; }
.recorrido.nula { background: var(--tinta-tenue); opacity: .35; }

.aguja { position: absolute; top: 50%; width: 2px; height: 20px; margin-top: -10px; border-radius: 2px; }
.aguja-pre { background: var(--tinta-tenue); opacity: .8; }
.aguja-post {
  width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: var(--tinta); border: 3px solid var(--fondo);
  animation: deslizar .85s var(--curva) both;
  left: var(--hasta);
}
.aguja-post.sube { background: var(--verde); box-shadow: 0 0 14px var(--verde); }
.aguja-post.baja { background: var(--azul); box-shadow: 0 0 14px var(--azul); }
.aguja-post.nula { background: var(--tinta-tenue); box-shadow: none; }

.medidor-pies {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 10px; font-family: var(--mono); font-size: .75rem; color: var(--tinta-tenue);
  font-variant-numeric: tabular-nums;
}
.destino { font-size: 1.25rem; font-weight: 700; color: var(--tinta); }
.destino.sube { color: var(--verde); }
.destino.baja { color: var(--azul); }

/* ============ agrupaciones ============ */

.cluster-nota {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: .875rem; color: var(--tinta-tenue);
  border: 1px dashed var(--borde-vivo); border-radius: var(--radio-s);
  padding: 13px 16px;
}
.cluster-nota b { color: var(--tinta-media); font-weight: 600; }

.tarjeta.cluster { border-color: color-mix(in srgb, var(--violeta) 40%, var(--borde)); }
.tarjeta.cluster .rotulo { color: var(--violeta); }
.tarjeta.cluster h3 { margin: 8px 0 4px; font-size: 1.0625rem; }
.tarjeta.cluster .criterio { margin: 0 0 12px; color: var(--tinta-media); font-size: .9375rem; }
.tarjeta.cluster ol { margin: 0; padding-left: 20px; color: var(--tinta-media); font-size: .9375rem; }
.tarjeta.cluster ol li { margin-bottom: 4px; }

/* Una agrupación cuyas cifras no se ha podido confirmar que midan esta misma
   combinación de tests. Sigue siendo útil, pero no puede ir vestida igual que
   la que sí está confirmada. */
.tarjeta.cluster.sinConfirmar { border-color: color-mix(in srgb, var(--ambar) 40%, var(--borde)); }
.tarjeta.cluster.sinConfirmar .rotulo { color: var(--ambar); }

.avisoComp {
  font-size: .75rem; color: var(--ambar);
  border: 1px solid color-mix(in srgb, var(--ambar) 35%, transparent);
  border-radius: 999px; padding: 1px 7px; margin-left: 6px; white-space: nowrap;
}

/* El careo entre lo que mostramos y lo que midió el artículo. Es lo que
   convierte un sello en algo comprobable. */
.careo {
  margin: 12px 0 0; padding: 11px 13px;
  border-radius: var(--radio-s); font-size: .8125rem; line-height: 1.5;
  color: var(--tinta-tenue);
  border: 1px solid color-mix(in srgb, var(--ambar) 30%, var(--borde));
  background: color-mix(in srgb, var(--ambar) 6%, transparent);
}
.careo b { color: var(--tinta-media); font-weight: 600; }
.careo.confirmado {
  border-color: color-mix(in srgb, var(--violeta) 30%, var(--borde));
  background: color-mix(in srgb, var(--violeta) 6%, transparent);
}

/* ============ tarjeta de test ============ */

.tests { display: grid; gap: 14px; }

.test {
  background: linear-gradient(180deg, var(--superficie-alta) 0%, var(--superficie) 100%);
  border: 1px solid var(--borde); border-radius: var(--radio);
  box-shadow: var(--sombra);
  overflow: hidden;
  animation: entrarCine .65s var(--curva) both;
  transition: border-color .25s, box-shadow .25s;
}
.test.marcado { border-color: var(--borde-vivo); }

/* El tono de cada tarjeta. No es decoración: sale de la calidad de la evidencia
   de ese test, así que un vistazo al listado ya dice dónde hay literatura
   sólida y dónde se pisa terreno flojo. Se queda deliberadamente tenue: los
   colores saturados están reservados al veredicto, que es lo que debe saltar. */
.test {
  position: relative;
  --tono: var(--tinta-tenue);
  background:
    radial-gradient(120% 70% at 0% 0%, color-mix(in srgb, var(--tono) 9%, transparent) 0%, transparent 62%),
    linear-gradient(180deg, var(--superficie-alta) 0%, var(--superficie) 100%);
}
.test.tono-verde { --tono: var(--verde); }
.test.tono-ambar { --tono: var(--ambar); }
.test.tono-rojo { --tono: var(--tinta-tenue); }
.test.tono-espera { --tono: var(--azul); }

.test::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 1px;
  background: linear-gradient(90deg, transparent, var(--tono), transparent 75%);
  opacity: .6;
}

/* La cabecera es lo primero que se lee de cada test y ahora se comporta como
   tal: el número entra deslizándose y el título tiene el peso de un titular. */
.test-cab {
  position: relative;
  display: flex; gap: 18px; align-items: flex-start;
  padding: 26px 24px 16px;
}
.test-cab::after {
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 0; height: 1px;
  background: linear-gradient(90deg, var(--borde-vivo), transparent 70%);
}

.orden {
  flex: none;
  font-family: var(--mono); font-size: 2.5rem; font-weight: 800; line-height: .9;
  letter-spacing: -.05em; font-variant-numeric: tabular-nums;
  background: linear-gradient(155deg, var(--tono) 0%, color-mix(in srgb, var(--tono) 45%, var(--tinta-tenue)) 50%, transparent 125%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 20px color-mix(in srgb, var(--tono) 28%, transparent));
  animation: entrarOrden .6s var(--curva) both;
  animation-delay: inherit;
  padding-top: 2px;
  transition: filter .4s var(--curva);
  text-align: center;
}
/* "Test" encima del número. Con fases numeradas en la página, un "01" suelto
   se confundía con la fase 1. */
.orden small {
  display: block; margin-bottom: 7px;
  font-family: var(--ui); font-size: .625rem; font-weight: 800; line-height: 1;
  letter-spacing: .22em; text-transform: uppercase; text-indent: .22em;
  color: var(--tinta-tenue);
}

/* Una tarjeta que ya se ha enseñado no vuelve a entrar al repintarse. */
.test.ya, .test.ya .orden { animation: none; }
/* Pero cuando le llega su evidencia, la franja de cifras se enciende un momento. */
.test.llega-dato .franja { animation: destello .9s var(--curva) both; }

.test-titulo { flex: 1; min-width: 0; }
.test-titulo h3 {
  margin: 0; font-size: clamp(1.3rem, 3.4vw, 1.6rem);
  letter-spacing: -.035em; line-height: 1.15; font-weight: 750;
  background: linear-gradient(120deg, var(--tinta) 20%, color-mix(in srgb, var(--azul) 55%, var(--tinta)) 120%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.objetivo { font-size: .9375rem; color: var(--tinta-tenue); margin-top: 6px; max-width: 62ch; }

/* La franja de cifras y calidad. Antes estaba escondida dentro del desplegable:
   la valoración de la evidencia se calculaba y no se veía. */
.franja { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 20px 14px; }

.cifra {
  font-family: var(--mono); font-size: .8125rem; font-variant-numeric: tabular-nums;
  background: var(--superficie-viva); border: 1px solid var(--borde);
  border-radius: 8px; padding: 5px 10px; color: var(--tinta);
}
.cifra i { font-style: normal; color: var(--tinta-tenue); }
.cifra.vacia { color: var(--tinta-tenue); }

.sello {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .8125rem; font-weight: 600; border-radius: 999px;
  padding: 6px 13px 6px 11px; border: 1px solid transparent;
}
.sello i {
  font-style: normal; font-size: .6875rem; text-transform: uppercase;
  letter-spacing: .07em; font-weight: 700; opacity: .7;
}
.sello::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sello.verde { color: var(--verde); background: var(--brillo-verde); border-color: color-mix(in srgb, var(--verde) 30%, transparent); }
.sello.ambar { color: var(--ambar); background: var(--brillo-ambar); border-color: color-mix(in srgb, var(--ambar) 30%, transparent); }
.sello.rojo { color: var(--tinta-tenue); background: var(--superficie-viva); border-color: var(--borde); }
.sello.buscando { color: var(--tinta-tenue); background: var(--superficie-viva); border-color: var(--borde); }
.sello.buscando::before { animation: latir 1.3s ease-in-out infinite; }

.marbete {
  font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  padding: 4px 9px; border-radius: 6px;
  background: var(--brillo-ambar); color: var(--ambar);
}

/* ============ etiquetas que se explican ============ */

/* Cada cifra, sello y marbete se toca y explica qué significa. El "?" no es
   adorno: sin él nadie sabría que se puede tocar, y quien no sabe qué es una
   sensibilidad tampoco sabe que puede preguntarlo. */
.pista {
  font-family: inherit; cursor: pointer; text-align: left;
  display: inline-flex; align-items: center; gap: 7px;
  transition: border-color .2s, box-shadow .2s, transform .15s var(--curva);
}
.cifra.pista { font-family: var(--mono); }
.pista:hover, .pista[aria-expanded="true"] {
  border-color: var(--borde-vivo);
  box-shadow: 0 0 0 3px var(--brillo-azul);
}
.pista:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.pista-ico {
  flex: none; display: grid; place-items: center;
  width: 15px; height: 15px; border-radius: 50%;
  font-family: var(--ui); font-size: .625rem; font-weight: 800; line-height: 1;
  color: var(--tinta-tenue); border: 1px solid currentColor; opacity: .7;
  transition: opacity .2s, color .2s;
}
.pista:hover .pista-ico, .pista[aria-expanded="true"] .pista-ico { opacity: 1; color: var(--azul); }
button.marbete.pista { border: 0; }
button.sello.pista { font-size: .8125rem; }

/* ============ el test mientras se investiga ============ */

.investigando {
  display: inline-flex; align-items: center; gap: 9px;
  font: inherit; font-size: .8125rem; font-weight: 600;
  color: var(--azul); cursor: pointer;
  background: var(--brillo-azul);
  border: 1px solid color-mix(in srgb, var(--azul) 30%, transparent);
  border-radius: 999px; padding: 6px 12px 6px 8px;
}

/* El halo de la espera, en pequeño: el fisioterapeuta ya asocia ese anillo con
   "está trabajando", así que no hace falta enseñarle otro símbolo. */
.mini-halo {
  position: relative; flex: none; width: 18px; height: 18px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 25%, var(--azul) 70%, var(--verde) 100%);
  -webkit-mask: radial-gradient(circle, transparent 5.5px, #000 6px);
          mask: radial-gradient(circle, transparent 5.5px, #000 6px);
  animation: girar 1.1s linear infinite;
}
.mini-halo i {
  position: absolute; top: -1px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
  border-radius: 50%; background: var(--verde); box-shadow: 0 0 8px var(--verde);
}

/* Las cifras que van a llegar: un brillo que las recorre, no una barra quieta. */
.cifra.fantasma {
  width: 132px; height: 29px; padding: 0; border-color: var(--borde);
  background: linear-gradient(90deg, var(--superficie-viva) 0%, color-mix(in srgb, var(--azul) 14%, var(--superficie-viva)) 50%, var(--superficie-viva) 100%);
  background-size: 200% 100%;
  animation: brillar 1.6s ease-in-out infinite;
}
.cifra.fantasma.corta { width: 118px; animation-delay: .2s; }

/* La línea de arriba de la tarjeta barre de lado a lado mientras dura. */

/* El halo de espera.

.espera {

  // Quien llega desde el enlace del correo canjea el token una sola vez: se
  // comprueba contra el servidor, se guarda y se limpia de la barra de
  // direcciones para que no acabe pegado en un chat por descuido.
  if (window.__accesoDelEnlace) {
    var recibido = window.__accesoDelEnlace;
    fetch("/api/verificar?acceso=" + encodeURIComponent(recibido))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) return aLaEntrada("enlace-invalido");
        try { localStorage.setItem(CLAVE_ACCESO, recibido); } catch (e) {}
        history.replaceState(null, "", "/app");
      })
      .catch(function () {});
  }

  var NIVELES = [
    { id: "baja", nombre: "Baja", detalle: "en torno al 15%", corto: "Baja · 15%" },
    { id: "media", nombre: "Media", detalle: "en torno al 45%", corto: "Media · 45%" },
    { id: "alta", nombre: "Alta", detalle: "en torno al 75%", corto: "Alta · 75%" }
  ];

  var estado = {
    entidad: "", terminos: [], region: "",
    tests: [], agrupaciones: [], banderas: [], advertencia: "",
    nivel: null,
    evidencias: {},
    resultados: {},
    // Interpretaciones que ha devuelto el servidor, por nombre de test. De aquí
    // sale la conclusión final: se reutiliza el cálculo del dominio en lugar de
    // rehacer la aritmética en el navegador, que acabaría divergiendo.
    interpretaciones: {},
    // Explicaciones personalizadas por test: undefined sin pedir, "pendiente",
    // el objeto de textos, o null si no ha habido.
    explicaciones: {}
  };

  /**
   * Estado de la interfaz, separado del clínico a propósito.
   *
   * Lo clínico es lo que el fisioterapeuta ha decidido; esto es solo cómo se le
   * está enseñando. La pantalla se repinta entera cada vez que llega una
   * evidencia, y sin memoria de lo ya mostrado cada repintado volvía a lanzar
   * todas las animaciones de entrada: con el sondeo en segundo plano, siete
   * tarjetas bailando siete veces.
   */
  function nuevaUi() {
    return {
      // La fase 1 se recoge en una línea en cuanto se elige la sospecha, y se
      // reabre a petición. Recogerla es lo que da la sensación de avanzar.
      f1Abierta: true,
      acabaDeElegir: false,
      acabaDeAbrir: false,
      // Qué se ha enseñado ya, para no volver a animarlo.
      vistos: {},
      // El estado con el que se pintó cada fase la vez anterior. Se pinta con
      // ese y se cambia al actual un instante después: es lo que permite que la
      // línea se rellene y el check se dibuje en vez de aparecer de golpe.
      fasesPrevias: {}
    };
