  var ui = nuevaUi();

  var salida = document.getElementById("salida");
  var form = document.getElementById("form");
  var campo = document.getElementById("sospecha");
  var enviar = document.getElementById("enviar");
  var consulta = document.getElementById("consulta");
  var trabajo = document.getElementById("trabajo");
  var carril = document.getElementById("carril");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // Cuando una función se pasa de tiempo, quien responde no es ella sino la
  // pasarela, y lo hace con una página de error en HTML. Al intentar leerla
  // como JSON saltaba un "Unexpected token '<'" que acababa impreso tal cual
  // en la ficha del test. El fisioterapeuta no tiene por qué leer eso.
  function leerJson(r) {
    return r.text().then(function (texto) {
      try {
        return JSON.parse(texto);
      } catch (e) {
        if (r.status === 502 || r.status === 503 || r.status === 504) {
          return { error: "La búsqueda de este test ha tardado demasiado y se ha cortado. Vuelve a intentarlo." };
        }
        return { error: "El servidor ha respondido algo que no se ha podido leer (" + r.status + ")." };
      }
    });
  }

  function pedir(ruta, cuerpo) {
    return fetch(ruta, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-acceso": acceso() },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      return leerJson(r).then(function (d) {
        if (r.status === 401) {
          aLaEntrada("caducado");
          throw new Error(d.error || "Tu acceso ya no es válido.");
        }
        if (typeof d.restantes === "number") mostrarRestantes(d.restantes);
        if (!r.ok) throw new Error(d.error || "El servidor ha devuelto un error.");
        if (d.error) throw new Error(d.error);
        return d;
      });
    });
  }

  var baseEstado = "";

  function mostrarRestantes(n) {
    var caja = document.getElementById("estado");
    if (caja) caja.textContent = baseEstado + " · " + n + " consultas hoy";
  }

  fetch("/api/estado").then(function (r) { return r.json(); }).then(function (d) {
    baseEstado = d.modelo + " · " + d.enCache + " en caché" + (d.credencial ? "" : " · sin clave");
    document.getElementById("estado").textContent = baseEstado;
  }).catch(function () {});

  /* ============ iconos ============ */

  function icono(tipo) {
    var trazo = '<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
    if (tipo === "decide") return trazo + '<path d="M20 6 9 17l-5-5"/></svg>';
    if (tipo === "mueve") return trazo + '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
    if (tipo === "nulo") return trazo + '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>';
    if (tipo === "alerta") return trazo + '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
    if (tipo === "libro") return trazo + '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
    return trazo + '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
  }

  /* ============ tira de sugerencias ============ */

  // Entidades concretas a propósito: un síndrome como "hombro doloroso" hace
  // que la herramienta pida que concretes, y como carta de presentación
  // conviene que la primera consulta de alguien salga bien a la primera.
  var EJEMPLOS = [
    "rotura del manguito rotador", "tendinopatía del supraespinoso", "capsulitis adhesiva",
    "inestabilidad glenohumeral anterior", "epicondilalgia lateral", "epitrocleítis",
    "síndrome del túnel carpiano", "tenosinovitis de De Quervain", "rizartrosis",
    "pinzamiento femoroacetabular", "tendinopatía glútea", "rotura del labrum acetabular",
    "rotura del ligamento cruzado anterior", "rotura de menisco medial", "tendinopatía rotuliana",
    "condromalacia rotuliana", "esguince del ligamento peroneoastragalino anterior",
    "fascitis plantar", "tendinopatía aquílea", "radiculopatía cervical",
    "hernia discal lumbar", "estenosis de canal lumbar"
  ];

  (function pintarTira() {
    var cinta = document.getElementById("tira-cinta");
    var boton = function (texto) {
      return '<button type="button" class="sugerencia" data-ej="' + esc(texto) + '">' + esc(texto) + "</button>";
    };
    // Dos vueltas de la misma lista: es lo que hace que el bucle no se note.
    cinta.innerHTML = EJEMPLOS.map(boton).join("") + EJEMPLOS.map(boton).join("");
  })();

  /* ============ el halo de espera ============ */

  /* Los pasos que se anuncian son los que el asistente da de verdad, y en este
     orden: reconoce la entidad, elige los tests, los ordena de cribado a
     confirmación y añade las banderas rojas de la región. Nada es de adorno;
     si algún día cambia el proceso, cambia esta lista. */
  var PASOS_ESPERA = [
    "Identificando la entidad clínica…",
    "Eligiendo los tests que la verifican…",
    "Ordenando la exploración, de cribado a confirmación…",
    "Comprobando las banderas rojas de la región…"
  ];

  function haloEspera(sospecha) {
    return '<div class="espera">' +
      '<div class="halo">' +
        '<svg viewBox="0 0 200 200" aria-hidden="true">' +
          "<defs>" +
            '<linearGradient id="degradadoHalo" x1="0" y1="0" x2="1" y2="1">' +
              '<stop offset="0%" stop-color="var(--azul)"/>' +
              '<stop offset="100%" stop-color="var(--verde)"/>' +
            "</linearGradient>" +
            '<radialGradient id="nucleoHalo">' +
              '<stop offset="0%" stop-color="var(--verde)" stop-opacity=".22"/>' +
              '<stop offset="60%" stop-color="var(--azul)" stop-opacity=".12"/>' +
              '<stop offset="100%" stop-color="var(--azul)" stop-opacity="0"/>' +
            "</radialGradient>" +
          "</defs>" +
          '<circle class="nucleo" cx="100" cy="100" r="74"/>' +
          '<circle class="anillo pista" cx="100" cy="100" r="96"/>' +
          '<circle class="anillo pista" cx="100" cy="100" r="78"/>' +
          '<circle class="anillo arco arco-1" cx="100" cy="100" r="96"/>' +
          '<circle class="anillo arco arco-2" cx="100" cy="100" r="78"/>' +
          '<circle class="anillo arco arco-3" cx="100" cy="100" r="62"/>' +
          '<g class="orbita"><circle class="chispa" cx="100" cy="4" r="4.5"/></g>' +
        "</svg>" +
        '<div class="halo-dentro">' +
          '<p class="espera-sujeto">' + esc(sospecha) + "</p>" +
          '<p class="espera-paso" id="espera-paso"></p>' +
        "</div>" +
      "</div>" +
    "</div>";
  }

  var rotador = null;
  var pasosActuales = PASOS_ESPERA.slice();

  function arrancarPasos() {
    pasosActuales = PASOS_ESPERA.slice();
    var i = 0;
    var siguiente = function () {
      var el = document.getElementById("espera-paso");
      if (!el) return;
      el.innerHTML = "<span>" + esc(pasosActuales[i % pasosActuales.length]) + "</span>";
      i++;
    };
    siguiente();
    rotador = setInterval(siguiente, 2600);
  }

  /**
   * Líneas escritas para esta sospecha concreta.
   *
   * Van por su cuenta y sin esperarlas: si tardan o fallan, la rotación sigue
   * con las fijas y el fisioterapeuta no nota nada. Cuando llegan, se ponen las
   * primeras y se ven al momento.
   */
  function pedirAliento(sospecha) {
    pedir("/api/aliento", { sospecha: sospecha })
      .then(function (d) {
        var frases = d.frases || [];
        if (!frases.length || !document.getElementById("espera-paso")) return;
        pasosActuales = frases.concat(PASOS_ESPERA);
        var el = document.getElementById("espera-paso");
        el.innerHTML = "<span>" + esc(frases[0]) + "</span>";
      })
      .catch(function () {});
  }

  function pararPasos() {
    if (rotador) { clearInterval(rotador); rotador = null; }
  }

  /** El mismo anillo, ya midiendo: se llena con los tests resueltos. */
  function anilloAvance(hechos, total) {
    var vuelta = 2 * Math.PI * 18;
    var recorrido = total ? (hechos / total) * vuelta : 0;
    return '<svg class="mini-halo" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">' +
      '<circle class="anillo pista" cx="22" cy="22" r="18"/>' +
      '<circle class="anillo avance" cx="22" cy="22" r="18" stroke-width="3"' +
        ' stroke-dasharray="' + vuelta.toFixed(1) + '"' +
        ' stroke-dashoffset="' + (vuelta - recorrido).toFixed(1) + '"/>' +
      "</svg>";
  }

  /* ============ consulta ============ */

  Array.prototype.forEach.call(document.querySelectorAll("[data-ej]"), function (b) {
    b.addEventListener("click", function () {
      campo.value = b.getAttribute("data-ej");
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    consultar(campo.value.trim());
  });

  function consultar(sospecha) {
    if (sospecha.length < 3) return;
    enviar.disabled = true;

    // La portada deja de ser portada: el campo se aparta arriba y la tira y el
    // historial desaparecen. Con la batería en pantalla solo estorban.
    consulta.classList.add("compacta");
    var tira = document.getElementById("tira");
    if (tira) tira.hidden = true;
    var caja = document.getElementById("recientes");
    if (caja) caja.hidden = true;

    trabajo.hidden = false;
    trabajo.classList.add("sin-carril");
    estado.tests = [];
    actualizarCarril();

    salida.innerHTML = haloEspera(sospecha);
    arrancarPasos();
    pedirAliento(sospecha);

    pedir("/api/bateria", { sospecha: sospecha })
      .then(function (d) {
        if (d.estado === "no_reconocida") return pintarAviso(d.mensaje, true);
        if (d.estado === "ambigua") return pintarAmbigua(d);

        estado.entidad = d.entidad;
        estado.terminos = d.terminosBusqueda || [];
        estado.region = d.region;
        estado.tests = d.tests;
        estado.agrupaciones = d.agrupaciones || [];
        estado.banderas = d.banderas || [];
        estado.advertencia = d.advertenciaBanderas || "";
        estado.nivel = null;
        estado.evidencias = {};
        estado.resultados = {};
        estado.interpretaciones = {};
        estado.explicaciones = {};
        ui = nuevaUi();
        cerrarGlobo();

        recordar(sospecha);
        pasoActivo = 1;
        pintar();
        buscarEvidencia();
      })
      .catch(function (err) { pintarAviso(err.message, true); })
      .finally(function () { pararPasos(); enviar.disabled = false; });
  }

  function pintarAviso(texto, malo) {
    salida.innerHTML = '<div class="seccion"><div class="aviso' + (malo ? " malo" : "") + '">' + esc(texto) + "</div></div>";
  }

  function pintarAmbigua(d) {
    salida.innerHTML =
      '<div class="seccion">' +
        '<span class="rotulo">Concreta la sospecha</span>' +
        '<div class="aviso" style="margin:12px 0 16px">' + esc(d.mensaje) + "</div>" +
        '<div class="opciones">' +
          d.alternativas.map(function (a) {
            return '<button class="opcion" data-alt="' + esc(a.entidad) + '">' +
              "<b>" + esc(a.entidad) + "</b><span>" + esc(a.matiz) + "</span></button>";
          }).join("") +
        "</div>" +
      "</div>";

    Array.prototype.forEach.call(salida.querySelectorAll("[data-alt]"), function (b) {
      b.addEventListener("click", function () {
        campo.value = b.getAttribute("data-alt");
        consultar(b.getAttribute("data-alt"));
      });
    });
  }

  /* ============ medidor de probabilidad ============ */

  var pct = function (x) { return Math.round(x * 100); };

  /**
   * La pieza que hace tangible lo abstracto: dónde estaba tu sospecha y a dónde
   * la lleva este resultado. Las zonas de los extremos son los umbrales a
   * partir de los cuales se habla de confirmar o descartar en la práctica.
   */
  function medidor(pre, post, sentido) {
    var a = Math.max(0, Math.min(100, pct(pre)));
    var b = Math.max(0, Math.min(100, pct(post)));
    var izq = Math.min(a, b);
    var ancho = Math.abs(b - a);
    var clase = sentido === "nulo" ? "nula" : (b >= a ? "sube" : "baja");

    return '<div class="medidor">' +
        '<div class="pista">' +
          '<span class="zona zona-descarta"></span>' +
          '<span class="zona zona-confirma"></span>' +
          '<span class="recorrido ' + clase + '" style="left:' + izq + '%;width:' + ancho + '%"></span>' +
          '<span class="aguja aguja-pre" style="left:' + a + '%"></span>' +
          '<span class="aguja aguja-post ' + clase + '" style="--desde:' + a + '%;--hasta:' + b + '%"></span>' +
        "</div>" +
        '<div class="medidor-pies">' +
          "<span>partías del " + a + "%</span>" +
          '<span class="destino ' + clase + '" data-desde="' + a + '" data-hasta="' + b + '">' + a + "%</span>" +
        "</div>" +
      "</div>";
  }

  /** Cuenta el porcentaje hasta su valor, para que el cambio se vea ocurrir. */
  function animarCifras(raiz) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    Array.prototype.forEach.call((raiz || document).querySelectorAll("[data-hasta]"), function (el) {
      var desde = Number(el.getAttribute("data-desde"));
      var hasta = Number(el.getAttribute("data-hasta"));
      if (reduce || desde === hasta) { el.textContent = hasta + "%"; return; }

      var inicio = null;
      var duracion = 850;
      function paso(t) {
        if (inicio === null) inicio = t;
        var avance = Math.min(1, (t - inicio) / duracion);
        var suave = 1 - Math.pow(1 - avance, 3);
        el.textContent = Math.round(desde + (hasta - desde) * suave) + "%";
        if (avance < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    });
  }

  /* ============ pintado principal ============ */

  function pintar() {
    var fases = estadoFases();

    salida.innerHTML = '<div class="fases">' +
      fase(fases[0], bloquePreTest()) +
      fase(fases[1], bloqueTests()) +
      fase(fases[2], '<div id="conclusion"></div>') +
    "</div>";
    ui.acabaDeElegir = false;
    ui.acabaDeAbrir = false;

    Array.prototype.forEach.call(salida.querySelectorAll("[data-nivel]"), function (b) {
      b.addEventListener("click", function () {
        estado.nivel = b.getAttribute("data-nivel");
        ui.f1Abierta = false;
        ui.acabaDeElegir = true;
        pintar();
      });
    });

    var cambiarNivel = salida.querySelector("[data-cambiar-nivel]");
    if (cambiarNivel) {
      cambiarNivel.addEventListener("click", function () {
        ui.f1Abierta = true;
        ui.acabaDeAbrir = true;
        pintar();
        var elegido = salida.querySelector('.nivel[aria-pressed="true"]') || salida.querySelector(".nivel");
        if (elegido) elegido.focus({ preventScroll: true });
      });
    }


    Array.prototype.forEach.call(salida.querySelectorAll("[data-ficha]"), function (b) {
      b.addEventListener("click", function () { abrirFicha(b.getAttribute("data-ficha")); });
    });

    Array.prototype.forEach.call(salida.querySelectorAll("[data-marcar]"), function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var nombre = b.getAttribute("data-marcar");
        var valor = b.getAttribute("data-valor");
        estado.resultados[nombre] = estado.resultados[nombre] === valor ? null : valor;
        if (!estado.resultados[nombre]) delete estado.interpretaciones[nombre];
        var tarjeta = b.closest(".test");
        if (tarjeta) tarjeta.classList.toggle("marcado", Boolean(estado.resultados[nombre]));
        interpretarTest(nombre);
      });
    });

    Object.keys(estado.resultados).forEach(function (nombre) {
      if (estado.resultados[nombre]) interpretarTest(nombre);
    });

    animarCifras(salida);
    refrescarConclusion();
    actualizarCarril();
    revelarFases();
    if (abierta) pintarGlobo();
  }

  /* ============ las tres fases ============ */

  /*
   * Las tres fases ya estaban en el carril de la izquierda, pero el contenido
   * era un único río: pregunta, agrupaciones, siete tarjetas y conclusión con el
   * mismo peso. El carril avisaba de que había pasos y la página no los tenía.
   *
   * Ahora cada fase es un capítulo con su titular, unidos por una línea que se
   * rellena al avanzar. No es un asistente de pantallas: los tests llegan poco a
   * poco, en consulta se va y se vuelve, y la conclusión se actualiza mientras
   * se marca. Se toma del asistente la sensación —saber dónde estás, que lo
   * hecho se recoja— sin nada que bloquee.
   *
   * Y sin colores propios por fase, deliberadamente. En esta herramienta el
   * verde, el ámbar y el rojo dicen cómo de fiable es una cifra; una "fase 3"
   * verde se leería como "conclusión fiable". La identidad de cada fase la dan
   * su número, su posición y la línea, con un único acento que se enciende.
   */
  function estadoFases() {
    var total = estado.tests.length;
    var marcados = Object.keys(estado.resultados).filter(function (n) { return estado.resultados[n]; }).length;
    var s = sintesis();
    var post = s.fase === "listo" && s.decisivo ? pct(s.decisivo.d.detalle.postTest) + "%" : null;

    var nivel = null;
    NIVELES.forEach(function (n) { if (n.id === estado.nivel) nivel = n; });

    var e1 = nivel ? "hecha" : "activa";
    var e2 = total && marcados === total ? "hecha" : (nivel || marcados ? "activa" : "pendiente");
    var e3 = s.fase === "sin_marcar" ? "pendiente" : (s.fase === "listo" && e2 === "hecha" ? "hecha" : "activa");

    return [
      {
        n: 1, estado: e1, titulo: "Tu sospecha",
        sub: "Con cuánta sospecha llegas al paciente",
        valor: nivel ? nivel.corto : "Empieza aquí"
      },
      {
        n: 2, estado: e2, titulo: "Tu exploración",
        sub: total + (total === 1 ? " test" : " tests") + ", de cribado a confirmación",
        valor: marcados ? marcados + " de " + total + " marcados" : total + " por explorar",
        valorCarril: marcados ? marcados + " de " + total : total + " tests"
      },
      {
        n: 3, estado: e3, titulo: "Tu conclusión",
        sub: "Qué hace lo explorado con tu sospecha",
        valor: s.fase === "sin_marcar" ? "Marca un resultado" : s.fase === "sin_nivel" ? "Falta tu sospecha" : s.calculando && !post ? "Calculando…" : (post || "Nada decide"),
        valorCarril: s.fase === "sin_marcar" ? "—" : s.fase === "sin_nivel" ? "falta sospecha" : s.calculando && !post ? "calculando…" : (post || "nada decide"),
        // El nombre del test que decide: era la mitad útil de la barra fija que
        // se quitó, y en el carril cabe sin estorbar.
        detalle: post && s.decisivo ? "lo decide " + s.decisivo.nombre : null
      }
    ];
  }

  function nodoFase(n, hecha, trazar) {
    return hecha
      ? '<svg class="nodo-tic' + (trazar ? " trazando" : "") + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></svg>'
      : '<span class="nodo-num">' + n + "</span>";
  }

  function fase(f, cuerpo) {
    // Se pinta con el estado de la vez anterior y se pasa al actual justo
    // después, en actualizarFases. Si se pintara directamente el actual, un
    // cambio de estado nunca se vería ocurrir: aparecería ya hecho.
    var previo = ui.fasesPrevias[f.n] || f.estado;
    var revelada = ui.vistos["fase-" + f.n] ? " revelada" : "";

    return '<section class="fase fase-' + f.n + " fase-" + previo + '" id="paso-' + f.n + '" data-fase="' + f.n + '" aria-labelledby="fase-titulo-' + f.n + '">' +
      '<header class="fase-cab' + revelada + '" data-num="0' + f.n + '">' +
        '<span class="fase-nodo">' + nodoFase(f.n, previo === "hecha", false) + "</span>" +
        '<div class="fase-titulos">' +
          '<span class="fase-eyebrow">Fase ' + f.n + '<span class="fase-de"> de 3</span></span>' +
          '<h2 class="fase-titulo" id="fase-titulo-' + f.n + '">' + f.titulo + "</h2>" +
          '<span class="fase-sub">' + esc(f.sub) + "</span>" +
        "</div>" +
        '<span class="fase-valor" data-fase-valor>' + esc(f.valor) + "</span>" +
        '<span class="fase-raya" aria-hidden="true"></span>' +
      "</header>" +
      '<div class="fase-cuerpo">' + cuerpo + "</div>" +
    "</section>";
  }

  /**
   * Pone cada fase en su estado actual sin repintar.
   *
   * Se llama tanto después de pintar como al marcar un resultado, que no
   * repinta la página. En los dos casos los elementos ya existen con su estado
   * anterior, así que cambiar la clase dispara las transiciones: la línea que
   * baja, el nodo que se enciende, el check que se traza.
   */
  function actualizarFases() {
    var secciones = salida.querySelectorAll(".fase[data-fase]");
    if (!secciones.length) return;

    // Obliga al navegador a asentar el estado anterior antes de cambiarlo. Sin
    // esto agruparía los dos cambios en uno y no habría transición.
    void salida.offsetHeight;

    var fases = estadoFases();
    Array.prototype.forEach.call(secciones, function (sec) {
      var n = Number(sec.getAttribute("data-fase"));
      var f = fases[n - 1];
      if (!f) return;

      if (!sec.classList.contains("fase-" + f.estado)) {
        sec.classList.remove("fase-hecha", "fase-activa", "fase-pendiente");
        sec.classList.add("fase-" + f.estado);
        var nodo = sec.querySelector(".fase-nodo");
        if (nodo) nodo.innerHTML = nodoFase(n, f.estado === "hecha", true);
      }

      var valor = sec.querySelector("[data-fase-valor]");
      if (valor && valor.textContent !== f.valor) {
        valor.textContent = f.valor;
        valor.classList.remove("cambia");
        void valor.offsetWidth;
        valor.classList.add("cambia");
      }

      ui.fasesPrevias[n] = f.estado;
    });
  }

  /** Los titulares de fase aparecen al llegar a ellos, una sola vez. */
  var observadorFases = null;
  function revelarFases() {
    var cabeceras = salida.querySelectorAll(".fase-cab:not(.revelada)");
    if (!cabeceras.length) return;

    var revelar = function (cab) {
      cab.classList.add("revelada");
      var sec = cab.closest(".fase");
      if (sec) ui.vistos["fase-" + sec.getAttribute("data-fase")] = true;
    };

    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(cabeceras, revelar);
      return;
    }

    // Lo que ya está a la vista se revela sin esperar al observador. Este avisa
    // en el siguiente ciclo, y en una pestaña que el navegador frena —en
    // segundo plano, o con el portátil en ahorro— eso puede ser un segundo con
    // el titular en blanco. Se fuerza un reflujo antes para que la transición
    // arranque desde el estado oculto y no se la salte.
    var alto = window.innerHeight || document.documentElement.clientHeight;
    var pendientes = [];
    Array.prototype.forEach.call(cabeceras, function (cab) {
      var r = cab.getBoundingClientRect();
      if (r.top < alto && r.bottom > 0) {
        void cab.offsetHeight;
        revelar(cab);
      } else {
        pendientes.push(cab);
      }
    });
    if (!pendientes.length) return;
    cabeceras = pendientes;

    if (observadorFases) observadorFases.disconnect();
    observadorFases = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        revelar(e.target);
        observadorFases.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.15 });

    Array.prototype.forEach.call(cabeceras, function (c) { observadorFases.observe(c); });
  }

  /* Las banderas ya no ocupan media pantalla en el listado: viven en el panel
     flotante, al que se llega desde el aviso del carril. El aviso está siempre
     a la vista y es rojo, así que se ven más que antes plegadas ahí abajo. */
  function abrirBanderas() {
    hojaCuerpo.innerHTML =
      '<span class="rotulo hoja-rotulo">Antes de seguir explorando</span>' +
      '<h3 id="hoja-titulo">Banderas rojas en ' + esc(estado.region) + "</h3>" +
      '<p class="hoja-pie">Descártalas antes de seguir. Son lo único de esta herramienta que puede cambiar tu conducta hoy mismo.</p>' +
      estado.banderas.map(function (b) {
        return '<div class="bandera ' + esc(b.prioridad) + '">' +
          '<div class="bandera-cab">' +
            "<h4>" + esc(b.titulo) + "</h4>" +
            '<span class="prioridad ' + esc(b.prioridad) + '">' + esc(b.prioridad) + "</span>" +
          "</div>" +
          "<ul>" + b.senales.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
          '<p class="bandera-accion">' + esc(b.accion) + "</p>" +
        "</div>";
      }).join("") +
      '<p class="advertencia">' + esc(estado.advertencia) + "</p>";

    devolverFoco = document.activeElement;
    hoja.hidden = false;
    document.body.style.overflow = "hidden";
    var cerrar = hoja.querySelector(".hoja-cerrar");
    if (cerrar) cerrar.focus();
  }

  /** Una entidad a mitad de frase va en minúscula, salvo que sea una sigla (LCA, STC). */
  function enFrase(texto) {
    var t = String(texto || "");
    if (t.length > 1 && t[1] === t[1].toUpperCase() && t[1] !== t[1].toLowerCase()) return t;
    return t.charAt(0).toLowerCase() + t.slice(1);
  }

  function bloquePreTest() {
    var niveles = NIVELES;

    var elegido = null;
    NIVELES.forEach(function (n) { if (n.id === estado.nivel) elegido = n; });

    // Contestada, la pregunta se aparta y deja una línea. Lo terminado deja de
    // pedir atención y la fase siguiente sube a ocupar su sitio.
    if (elegido && !ui.f1Abierta) {
      return '<div class="fase-resumen' + (ui.acabaDeElegir ? " entra" : "") + '">' +
        '<span class="fase-resumen-texto">Llegas con una sospecha <b>' + esc(elegido.nombre.toLowerCase()) + "</b> de " +
          esc(enFrase(estado.entidad)) + '<i>' + esc(elegido.detalle) + "</i></span>" +
        '<button class="btn-cambiar" data-cambiar-nivel>Cambiar</button>' +
      "</div>";
    }

    return '<div><div class="tarjeta pretest' + (ui.acabaDeAbrir ? " entra" : "") + '">' +
      "<h3>¿Cómo de fuerte es tu sospecha de " + esc(estado.entidad) + "?</h3>" +
      "<p>La conclusión de cada test depende de con cuánta sospecha llegas a él. Se pregunta una sola vez y se aplica a toda la batería.</p>" +
      '<div class="niveles">' +
        niveles.map(function (n) {
          return '<button class="nivel" data-nivel="' + n.id + '" aria-pressed="' + (estado.nivel === n.id) + '">' +
            "<b>" + n.nombre + "</b><span>" + n.detalle + "</span></button>";
        }).join("") +
      "</div></div></div>";
  }

  /**
   * Agrupaciones.
   *
   * Solo merecen protagonismo cuando la literatura publica su precisión como
   * conjunto: son la única forma legítima de combinar varios tests. Mientras no
   * esté verificado, ocupar dos tarjetas grandes para acabar diciendo "no me
   * hagas caso" era ruido, y encima ruido destacado. Se queda en una línea.
   */
  function bloqueAgrupaciones() {
    if (!estado.agrupaciones.length) return "";

    var validadas = estado.agrupaciones.filter(function (a) {
      var ev = estado.evidencias[a.nombre];
      return ev && ev.hayCifras;
    });

    var html = validadas.map(function (a) {
      var ev = estado.evidencias[a.nombre];
      var comp = ev.agrupacion;

      // "Validada" solo si el artículo del que salen las cifras describe esta
      // misma combinación de tests y dice con qué regla la da por positiva.
      // Antes bastaba con que la búsqueda devolviera cifras para un nombre
      // parecido, que es bastante menos de lo que la palabra prometía.
      var confirmada = comp && comp.coincide;
      var rotulo = confirmada
        ? "Agrupación confirmada por el artículo"
        : "Agrupación con cifras publicadas";

      // Los tests se enseñan con el nombre de la batería cuando es el mismo
      // test: ver "Joint line tenderness" aquí y "Palpación de la interlínea
      // articular" ahí abajo parecen dos pruebas distintas y son una.
      // Una entrada guardada antes de que existiera el careo no lo trae. Ahí no
      // se marca nada: decir "no está en la batería" sin haberlo comprobado
      // sería el mismo error, del revés.
      var equivalencias = comp && comp.equivalencias;
      var lista = equivalencias
        ? equivalencias.map(function (e) {
            return "<li>" + esc(e.enBateria || e.propuesto) +
              (e.enBateria ? "" : ' <span class="avisoComp">no está en la batería de abajo</span>') +
            "</li>";
          }).join("")
        : a.tests.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");

      var careo = "";
      if (comp && !comp.coincide) {
        careo = '<div class="careo">' + esc(comp.motivo) +
          (comp.delArticulo && comp.delArticulo.length
            ? "<br><b>El artículo combina:</b> " + esc(comp.delArticulo.join(" · "))
            : "") +
          (comp.criterio ? "<br><b>Con la regla:</b> " + esc(comp.criterio) : "") +
        "</div>";
      } else if (comp && comp.criterio) {
        careo = '<div class="careo confirmado"><b>Regla del artículo:</b> ' + esc(comp.criterio) + "</div>";
      }

      return '<div class="tarjeta cluster' + (confirmada ? "" : " sinConfirmar") + '" style="margin-bottom:14px">' +
        '<span class="rotulo">' + rotulo + "</span>" +
        "<h3>" + esc(a.nombre) + "</h3>" +
        '<p class="criterio">' + esc(a.criterio) + "</p>" +
        "<ol>" + lista + "</ol>" +
        careo +
        '<div class="franja" style="padding:14px 0 0">' + chipsCifras(ev) + selloCalidad(ev) + "</div>" +
        fuente(ev) +
      "</div>";
    }).join("");

    var pendientes = estado.agrupaciones.filter(function (a) {
      var ev = estado.evidencias[a.nombre];
      return !ev || !ev.hayCifras;
    });

    if (pendientes.length) {
      var buscando = pendientes.some(function (a) { return !estado.evidencias[a.nombre]; });
      html += '<div class="cluster-nota">' + icono("info") +
        "<span>" + (buscando
          ? "Comprobando si hay agrupaciones validadas para esta patología…"
          : "<b>" + pendientes.length + (pendientes.length === 1 ? " agrupación descrita" : " agrupaciones descritas") +
            "</b> para esta patología (" + esc(pendientes.map(function (a) { return a.nombre; }).join(", ")) +
            "), pero sin precisión diagnóstica publicada del conjunto. Interpreta cada test por separado.") +
        "</span></div>";
    }

    return html;
  }

  function bloqueTests() {
    var listos = estado.tests.filter(function (t) { return estado.evidencias[t.nombre]; }).length;
    var total = estado.tests.length;

    var progreso = listos < total
      ? '<div class="progreso">' +
          anilloAvance(listos, total) +
          '<span class="progreso-texto">Rastreando PubMed · <b>' + listos + " de " + total + "</b><br>" +
            '<small>Leyendo la precisión publicada de cada test</small></span>' +
        "</div>"
      : "";

    return "<div>" +
      bloqueAgrupaciones() +
      progreso +
      '<div class="tests">' + estado.tests.map(tarjetaTest).join("") + "</div>" +
      '<p class="nota-cadena">Cada test se interpreta contra tu sospecha inicial, de forma independiente. Los resultados de varios tests sueltos no se encadenan: hacerlo daría una certeza que la evidencia no respalda, porque tests que exploran la misma estructura no aportan información independiente.</p>' +
    "</div>";
  }

  function tarjetaTest(t, i) {
    var ev = estado.evidencias[t.nombre];
    var marcado = estado.resultados[t.nombre];
    var id = esc(t.nombre);
    // Mientras se busca, el tono es el azul de "trabajando"; al llegar la
    // evidencia lo fija su semáforo de calidad.
    var tono = ev && ev.calidad ? esc(ev.calidad.id) : "espera";

    // La entrada solo la primera vez que aparece la tarjeta. Y cuando le llega
    // su evidencia, un destello en la franja de cifras: es el momento en que la
    // tarjeta pasa de "buscando" a tener algo que decir.
    var clave = "test-" + t.nombre;
    var ya = ui.vistos[clave] ? " ya" : "";
    ui.vistos[clave] = true;
    var llega = ev && !ui.vistos["ev-" + t.nombre] && ya ? " llega-dato" : "";
    if (ev) ui.vistos["ev-" + t.nombre] = true;

    return '<div class="test tono-' + tono + (marcado ? " marcado" : "") + (ev ? "" : " buscando") + ya + llega + '" style="animation-delay:' + Math.min(i * 55, 400) + 'ms">' +
      '<div class="test-cab">' +
        // "Test 01" y no "01" a secas: con fases numeradas encima, un número
        // suelto se confundía con ellas.
        '<span class="orden"><small>Test</small> ' + String(i + 1).padStart(2, "0") + "</span>" +
        '<div class="test-titulo">' +
          "<h3>" + esc(t.nombre) + "</h3>" +
          '<div class="objetivo">' + esc(t.objetivo) + "</div>" +
        "</div>" +
      "</div>" +
      '<div class="franja">' + (ev ? chipsCifras(ev, t.nombre) + selloCalidad(ev, t.nombre) + marbetes(ev, t.nombre) : investigando(t.nombre)) + "</div>" +
      '<div class="test-acciones">' +
        '<span class="rotulo">Resultado</span>' +
        '<button class="btn-res" data-marcar="' + id + '" data-valor="positivo" aria-pressed="' + (marcado === "positivo") + '">Positivo</button>' +
        '<button class="btn-res" data-marcar="' + id + '" data-valor="negativo" aria-pressed="' + (marcado === "negativo") + '">Negativo</button>' +
        '<button class="btn-ficha" data-ficha="' + id + '">¿Cómo se hace?</button>' +
      "</div>" +
      '<div class="hueco" data-hueco="' + id + '"></div>' +
      fuente(ev) +
    "</div>";
  }

  function paso(etiqueta, texto) {
    return '<div class="paso"><dt>' + etiqueta + "</dt><dd>" + esc(texto) + "</dd></div>";
  }

  /* ============ ficha de ejecución ============ */

  var hoja = document.getElementById("hoja");
  var hojaCuerpo = document.getElementById("hoja-cuerpo");
  var devolverFoco = null;

  function abrirFicha(nombre) {
    var t = null;
    estado.tests.forEach(function (x) { if (x.nombre === nombre) t = x; });
    if (!t) return;

    var ev = estado.evidencias[nombre];

    hojaCuerpo.innerHTML =
      '<span class="rotulo hoja-rotulo">Cómo se ejecuta</span>' +
      '<h3 id="hoja-titulo">' + esc(t.nombre) + "</h3>" +
      "<dl>" +
        paso("Paciente", t.posicionPaciente) +
        paso("Terapeuta", t.posicionTerapeuta) +
        paso("Maniobra", t.maniobra) +
        paso("Positivo si", t.positivoSi) +
      "</dl>" +
      (t.otrosNombres && t.otrosNombres.length
        ? '<p class="nota-cadena">También conocido como: ' + esc(t.otrosNombres.join(", ")) + ".</p>"
        : "") +
      (ev && ev.calidad && ev.calidad.motivos && ev.calidad.motivos.length
        ? '<p class="nota-cadena" style="margin-top:20px"><b>Sobre la evidencia de este test</b></p>' +
          '<ul class="motivos">' + ev.calidad.motivos.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul>"
        : "");

    devolverFoco = document.activeElement;
    hoja.hidden = false;
    document.body.style.overflow = "hidden";
    var cerrar = hoja.querySelector(".hoja-cerrar");
    if (cerrar) cerrar.focus();
  }

  function cerrarFicha() {
    hoja.hidden = true;
    document.body.style.overflow = "";
    if (devolverFoco && devolverFoco.focus) devolverFoco.focus();
    devolverFoco = null;
  }

  Array.prototype.forEach.call(hoja.querySelectorAll("[data-cerrar-hoja]"), function (b) {
    b.addEventListener("click", cerrarFicha);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !hoja.hidden) cerrarFicha();
  });

  /** Las cifras como piezas propias, no como un texto gris al margen. */
  /**
   * Una etiqueta que se puede tocar para que explique qué significa.
   *
   * Sustituye al cuadro de "Qué significan Sn y Sp", que explicaba en abstracto
   * y lejos de la cifra. Ahora la explicación está en la propia cifra, habla de
   * este test y de esta patología, y se abre tocando: un tooltip que solo
   * aparece al pasar el ratón no existe en el móvil con el que se explora.
   *
   * Sin nombre de test (las agrupaciones) se pinta como etiqueta quieta.
   */
  function pista(tipo, nombre, clase, contenido) {
    if (!nombre) return '<span class="' + clase + '">' + contenido + "</span>";
    return '<button type="button" class="' + clase + ' pista" data-pista="' + tipo + '" data-test="' + esc(nombre) + '" aria-expanded="false" aria-controls="globo">' +
      contenido + '<span class="pista-ico" aria-hidden="true">?</span></button>';
  }

  /** Mientras se lee la literatura: que se vea que la tarjeta está viva, no rota. */
  function investigando(nombre) {
    return pista("buscando", nombre, "investigando",
        '<span class="mini-halo" aria-hidden="true"><i></i></span><span>Investigando la literatura…</span>') +
      '<span class="cifra fantasma" aria-hidden="true"></span>' +
      '<span class="cifra fantasma corta" aria-hidden="true"></span>';
  }

  function chipsCifras(ev, nombre) {
    if (!ev) return '<span class="cifra vacia"><span class="esqueleto" style="width:88px;display:inline-block;vertical-align:-2px"></span></span>';
    if (!ev.hayCifras) return pista("sin", nombre, "cifra vacia", "sin cifras publicadas");

    // Con el nombre entero y no con la abreviatura: "Sn" obliga a traducir
    // mentalmente antes de entender, y esto lo usa gente que no vive en la
    // medicina basada en la evidencia.
    var trozos = "";
    trozos += ev.sn != null
      ? pista("sn", nombre, "cifra", "<i>Sensibilidad</i> " + num(ev.sn, true))
      : pista("falta-sn", nombre, "cifra vacia", "<i>Sensibilidad</i> no publicada");
    trozos += ev.sp != null
      ? pista("sp", nombre, "cifra", "<i>Especificidad</i> " + num(ev.sp, true))
      : pista("falta-sp", nombre, "cifra vacia", "<i>Especificidad</i> no publicada");
    return trozos;
  }

  var ADJETIVOS_CALIDAD = { verde: "sólida", ambar: "limitada", rojo: "insuficiente" };

  /**
   * El semáforo de calidad. Valora el artículo, no la utilidad del test: un
   * estudio impecable puede medir un test que no sirve para nada.
   */
  function selloCalidad(ev, nombre) {
    if (!ev) return '<span class="sello buscando">buscando evidencia</span>';
    if (!ev.calidad) return "";
    var c = ev.calidad;
    return pista("calidad", nombre, "sello " + esc(c.id),
      "<i>Calidad del estudio</i>" + esc(ADJETIVOS_CALIDAD[c.id] || c.etiqueta));
  }

  function marbetes(ev, nombre) {
    if (!ev || !ev.hayCifras) return "";
    var m = "";
    if (ev.indirecta) m += pista("indirecta", nombre, "marbete", "evidencia indirecta");
    if (ev.parcial) m += pista("parcial", nombre, "marbete", "cifra parcial");
    return m;
  }

  /* ============ los globos explicativos ============ */

  /*
   * Dos capas, y se ven distintas a propósito.
   *
   * La primera es fija: plantillas escritas aquí que ponen en frase los datos de
   * la ficha. No inventan nada porque no generan nada, y está siempre.
   *
   * La segunda la redacta un modelo para este test y esta patología. Llega un
   * poco después, pasa por un candado que descarta cualquier número que no
   * estuviera en los datos, y va rotulada como redactada con IA. Si no llega, el
   * globo sigue completo con la primera.
   */

  var MAGNITUD_NEGATIVO = {
    concluyente: "un <b>negativo</b> descarta con mucha fuerza",
    moderado: "un <b>negativo</b> baja bastante tu sospecha",
    pequeno: "un <b>negativo</b> baja algo tu sospecha, pero no descarta",
    irrelevante: "un <b>negativo</b> apenas cambia tu sospecha"
  };
  var MAGNITUD_POSITIVO = {
    concluyente: "un <b>positivo</b> confirma con mucha fuerza",
    moderado: "un <b>positivo</b> sube bastante tu sospecha",
    pequeno: "un <b>positivo</b> sube algo tu sospecha, pero no confirma",
    irrelevante: "un <b>positivo</b> apenas cambia tu sospecha"
  };

  function contenidoPista(tipo, nombre) {
    var ev = estado.evidencias[nombre];
    var exp = estado.explicaciones[nombre];
    var ent = esc(enFrase(estado.entidad));
    var ia = null;
    var titulo = "";
    var cuerpo = "";

    if (tipo === "buscando") {
      titulo = "Investigando";
      cuerpo = "Estamos leyendo la literatura publicada sobre este test en " + ent + ". " +
        "Suele tardar entre unos segundos y un par de minutos.<br><br>" +
        "Puedes marcar el resultado mientras tanto: se interpretará solo en cuanto lleguen las cifras.";
      return { titulo: titulo, cuerpo: cuerpo, ia: null, conIa: false };
    }
    if (!ev) return null;

    var rv = ev.rv || null;
    var pct100 = function (x) { return Math.round(x * 100); };

    if (tipo === "sn") {

      cuerpo = "De cada 100 personas que <b>sí</b> tienen " + ent + ", el test da positivo en <b>" + pct100(ev.sn) + "</b>. " +
        (rv ? "Con las dos cifras de este test, " + MAGNITUD_NEGATIVO[rv.magnitudNegativa] + "."
            : "Sin la especificidad no puede calcularse cuánto descarta un negativo.");
      ia = exp && exp.sensibilidad;
    } else if (tipo === "sp") {

      cuerpo = "De cada 100 personas que <b>no</b> tienen " + ent + ", el test da negativo en <b>" + pct100(ev.sp) + "</b>. " +
        (rv ? "Con las dos cifras de este test, " + MAGNITUD_POSITIVO[rv.magnitudPositiva] + "."
            : "Sin la sensibilidad no puede calcularse cuánto confirma un positivo.");
      ia = exp && exp.especificidad;
    } else if (tipo === "falta-sp") {
      titulo = "Especificidad no publicada";
      cuerpo = "Nadie ha publicado en cuántas personas <b>sin</b> " + ent + " da negativo este test. " +
        "Sin ese dato no se puede saber cuánto confirma un <b>positivo</b>.";
      ia = exp && exp.parcial;
    } else if (tipo === "falta-sn") {
      titulo = "Sensibilidad no publicada";
      cuerpo = "Nadie ha publicado en cuántas personas <b>con</b> " + ent + " da positivo este test. " +
        "Sin ese dato no se puede saber cuánto descarta un <b>negativo</b>.";

    } else if (tipo === "calidad") {

      if (!ev.hayCifras) {

      } else if (c.id === "verde") {

      } else {

          "<ul>" + motivos.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul>" +

  var globo = document.createElement("div");
  globo.id = "globo";
  globo.className = "globo";
  globo.setAttribute("role", "dialog");
  globo.hidden = true;
  document.body.appendChild(globo);

  // Qué globo está abierto. Se guarda por tipo y test, no por elemento: la
  // página se repinta al llegar cada evidencia y el botón de antes ya no existe.
  var abierta = null;
  var puedePasarRaton = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var temporizadorGlobo = null;

  function botonPista(p) {
    if (!p) return null;
    var candidatos = salida.querySelectorAll('[data-pista="' + p.tipo + '"]');
    for (var i = 0; i < candidatos.length; i++) {
      if (candidatos[i].getAttribute("data-test") === p.test) return candidatos[i];
    }
    return null;
  }

  function pintarGlobo() {
    if (!abierta) return;
    var boton = botonPista(abierta);
    var c = boton && contenidoPista(abierta.tipo, abierta.test);
    if (!c) { cerrarGlobo(); return; }

    var capaIa = "";
    if (c.ia) {
      capaIa = '<div class="globo-ia"><span class="globo-ia-rotulo">En tu caso</span>' +
        "<p>" + esc(c.ia) + "</p>" +
        "<small>Redactado con IA a partir de estas cifras</small></div>";
    } else if (c.conIa && estado.explicaciones[abierta.test] === "pendiente") {
      capaIa = '<div class="globo-ia cargando-ia"><span class="esqueleto"></span><span class="esqueleto corto"></span></div>';
    }

    globo.innerHTML = '<span class="globo-titulo">' + esc(c.titulo) + "</span>" +
      '<div class="globo-cuerpo">' + c.cuerpo + "</div>" + capaIa;
    globo.hidden = false;
    colocarGlobo(boton);

    Array.prototype.forEach.call(salida.querySelectorAll('.pista[aria-expanded="true"]'), function (b) {
      if (b !== boton) b.setAttribute("aria-expanded", "false");
    });
    boton.setAttribute("aria-expanded", "true");
  }

  function colocarGlobo(boton) {
    var r = boton.getBoundingClientRect();
    var margen = 16;
    var ancho = Math.min(340, window.innerWidth - margen * 2);
    globo.style.width = ancho + "px";
    var izquierda = Math.max(margen, Math.min(r.left, window.innerWidth - ancho - margen));
    var alto = globo.offsetHeight;
    var cabeAbajo = r.bottom + 10 + alto <= window.innerHeight - 12;
    var arriba = !cabeAbajo && r.top - alto - 10 > 12;
    var top = arriba ? r.top - alto - 10 : r.bottom + 10;

    globo.style.left = (izquierda + window.scrollX) + "px";
    globo.style.top = (top + window.scrollY) + "px";
    globo.style.setProperty("--flecha", Math.max(14, Math.min(ancho - 14, r.left + r.width / 2 - izquierda)) + "px");
    globo.classList.toggle("arriba", arriba);
  }

  function abrirGlobo(tipo, test, fijada) {
    clearTimeout(temporizadorGlobo);
    var misma = abierta && abierta.tipo === tipo && abierta.test === test;
    abierta = { tipo: tipo, test: test, fijada: fijada || (misma && abierta.fijada) };
    if (!misma) globo.classList.remove("entra");
    pintarGlobo();
    if (!misma) { void globo.offsetWidth; globo.classList.add("entra"); }
  }

  function cerrarGlobo() {
    clearTimeout(temporizadorGlobo);
    if (!abierta) return;
    var boton = botonPista(abierta);
    if (boton) boton.setAttribute("aria-expanded", "false");
    abierta = null;

  }

  salida.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-pista]");
    if (!b) return;
    e.stopPropagation();
    var tipo = b.getAttribute("data-pista");
    var test = b.getAttribute("data-test");
    if (abierta && abierta.tipo === tipo && abierta.test === test && abierta.fijada) { cerrarGlobo(); return; }
    abrirGlobo(tipo, test, true);
  });

  if (puedePasarRaton) {
    salida.addEventListener("mouseover", function (e) {
      var b = e.target.closest && e.target.closest("[data-pista]");
      if (!b || (abierta && abierta.fijada)) return;
      clearTimeout(temporizadorGlobo);
      temporizadorGlobo = setTimeout(function () {
        abrirGlobo(b.getAttribute("data-pista"), b.getAttribute("data-test"), false);
      }, 220);
    });
    salida.addEventListener("mouseout", function (e) {
      var b = e.target.closest && e.target.closest("[data-pista]");
      if (!b || !abierta || abierta.fijada) return;
      clearTimeout(temporizadorGlobo);
      temporizadorGlobo = setTimeout(cerrarGlobo, 180);
    });
    globo.addEventListener("mouseenter", function () { clearTimeout(temporizadorGlobo); });
    globo.addEventListener("mouseleave", function () {
      if (abierta && !abierta.fijada) temporizadorGlobo = setTimeout(cerrarGlobo, 180);
    });
  }

  document.addEventListener("click", function (e) {
    if (abierta && !globo.contains(e.target)) cerrarGlobo();
  });
  document.addEventListener("keydown", function (e) {

  window.addEventListener("resize", function () {

  });

  /* ============ explicaciones personalizadas ============ */

  var colaExplicaciones = [];
  var explicando = 0;

  function pedirExplicacion(el) {
    if (el.tipo !== "test" || estado.explicaciones[el.nombre] !== undefined) return;
    estado.explicaciones[el.nombre] = "pendiente";
    colaExplicaciones.push({ el: el, entidad: estado.entidad, terminos: estado.terminos });
    siguienteExplicacion();
  }

  function siguienteExplicacion() {
    // De dos en dos: son un añadido, y no deben competir con la búsqueda.
    if (explicando >= 2 || !colaExplicaciones.length) return;
    var trabajo = colaExplicaciones.shift();
    if (trabajo.entidad !== estado.entidad) { siguienteExplicacion(); return; }
    explicando += 1;

    var nombre = trabajo.el.nombre;
    pedir("/api/explicar", { entidad: trabajo.entidad, terminosBusqueda: trabajo.terminos, elemento: trabajo.el })
      .then(function (d) { return d.explicacion || null; })
      .catch(function () { return null; })
      .then(function (exp) {
        explicando -= 1;
        if (trabajo.entidad === estado.entidad) {
          estado.explicaciones[nombre] = exp;
          if (abierta && abierta.test === nombre) pintarGlobo();
          if (estado.resultados[nombre]) interpretarTest(nombre);
        }
        siguienteExplicacion();
      });
  }

  /** Coma decimal. Las proporciones siempre con dos decimales: 0,80 y no 0,8. */
  function num(x, proporcion) {
    var opciones = proporcion
      ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
      : { maximumFractionDigits: 2 };
    return Number(x).toLocaleString("es-ES", opciones);
  }

  /**
   * Los artículos que se leyeron, plegados.
   *
   * Se leen quince y se cita uno: el que publica la cifra. Citar los quince
   * sería ruido, pero sin decirlo el trabajo de la búsqueda es invisible y
   * parece que se ha mirado un solo sitio.
   */
  function leidos(ev, titulo) {
    var lista = ev.consultados || [];
    if (lista.length < 2) return "";
    return '<details class="leidos"><summary>' + esc(titulo) + "</summary><ul>" +
      lista.map(function (c) {
        var actual = ev.cita && c.pmid === ev.cita.pmid;
        return "<li>" + (actual ? "<b>" : "") +
          '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.titulo) + "</a>" +
          (actual ? "</b> · es el citado" : "") + "</li>";
      }).join("") +
    "</ul></details>";
  }

  /** La cita, siempre visible. Es lo que permite comprobar el número. */
  function fuente(ev) {
    if (!ev) return "";

    if (!ev.hayCifras) {
      // Cuando no hay cifras, lo que hay que enseñar es la lista entera y no
      // dos: la pregunta que se hace uno es "¿de verdad no está en ninguno?", y
      // dos títulos sueltos no la contestan. Antes esta ficha parecía haber
      // mirado dos artículos y la de al lado quince, y eran los mismos quince.
      return '<div class="fuente">' + icono("libro") + "<span>" +
        esc(ev.motivo || ev.error || "No se han localizado cifras de precisión.") +
        leidos(ev, "Se leyeron " + (ev.consultados || []).length + " artículos · ninguno publica la cifra") +
      "</span></div>";
    }

    if (!ev.cita) return "";

    // Se leen quince artículos y se cita uno: el que publica la cifra. Es lo
    // que permite comprobar el número en dos clics, y citar los quince sería
    // ruido. Pero sin decirlo, el trabajo de la búsqueda es invisible y parece
    // que se ha mirado un solo sitio.
    var resto = leidos(ev, "Se leyeron " + (ev.consultados || []).length +
      " artículos · se cita el que publica la cifra");

    return '<div class="fuente">' + icono("libro") + "<span>" +
      '<a href="' + esc(ev.cita.url) + '" target="_blank" rel="noopener">' + esc(ev.cita.titulo) + "</a> · " +
      esc(ev.cita.revista) + " " + esc(ev.cita.anio) +
      (ev.trazable === false ? " · <b>cifra no localizada en la frase citada, compruébala</b>" : "") +
      resto +
    "</span></div>";
  }

  /* ============ evidencia ============ */

  // Peticiones simultáneas. Cada una hace varias consultas a PubMed, que
  // limita a unas tres por segundo, y cada función corre por su cuenta sin
  // saber de las demás: con tres frentes se va rápido sin que nos cierre la
  // puerta por exceso de peticiones.
  var SIMULTANEAS = 3;

  /**
   * Un test por petición, en paralelo, pintando cada uno en cuanto llega.
   *
   * Antes se pedían todos de golpe y se resolvían en serie en el servidor: la
   * primera consulta de una entidad nueva tardaba minutos con la pantalla
   * quieta, y no cabía en el límite de tiempo de una función de Netlify.
   */
  function buscarEvidencia() {
    var elementos = estado.agrupaciones.map(function (a) {
      return {
        nombre: a.nombre,
        // En inglés: PubMed no indexa nada en español, y buscar "Combinación de
        // Park" no devolvía un solo artículo. Las agrupaciones llevaban días
        // sin encontrar cifras por esto, y parecía que era por falta de
        // literatura.
        busqueda: a.nombreBusqueda || a.nombre,
        nombresBusqueda: a.nombresBusqueda || [],
        tipo: "agrupacion",
        componentes: a.tests || [],
        // Para que el servidor pueda enseñar cada componente con el nombre que
        // lleva en la batería, en vez de con el que usó el artículo en inglés.
        bateria: estado.tests.map(function (t) { return t.nombre; })
      };
    })
      .concat(estado.tests.map(function (t) {
        return {
          nombre: t.nombre,
          busqueda: t.nombreBusqueda || t.nombre,
          nombresBusqueda: t.nombresBusqueda || [],
          tipo: "test"
        };
      }));

    // Si el fisioterapeuta lanza otra sospecha mientras esta sigue en curso,
    // las respuestas que lleguen tarde no deben pintarse sobre la nueva.
    var enCurso = estado.entidad;
    var siguiente = 0;

    /**
     * Pregunta por un test hasta que haya respuesta.
     *
     * El servidor ya no resuelve la búsqueda en la misma petición: contesta
     * "listo", "en curso" o "fallo", y el trabajo de verdad corre aparte con
     * quince minutos por delante en vez de treinta segundos. Eso es lo que
     * permite que se lea el texto completo de los artículos, que antes se
     * saltaba casi siempre por falta de tiempo.
     *
     * El sondeo empieza rápido y se va espaciando: casi todo lo que se pide ya
     * está en la base y contesta a la primera, así que no tiene sentido
     * machacar cada segundo durante medio minuto por los pocos que no.
     */
    function esperarPor(el, intento) {
      return pedir("/api/evidencia", {
        entidad: estado.entidad,
        terminosBusqueda: estado.terminos,
        elemento: el
      }).then(function (d) {
        if (estado.entidad !== enCurso) return null;

        if (d.estado === "listo") return d.evidencia;
        if (d.estado === "fallo") return { hayCifras: false, error: d.motivo };

        // Sigue en marcha. Se abandona pasados unos minutos: a esas alturas el
        // trabajador está muerto y su marca caducará sola, así que insistir
        // solo gastaría peticiones.
        var n = (intento || 0) + 1;
        if (n > 90) return { hayCifras: false, error: "La búsqueda de este test está tardando demasiado. Vuelve a intentarlo." };

        var espera = n < 5 ? 1200 : n < 15 ? 2500 : 4000;
        return new Promise(function (listo) { setTimeout(listo, espera); })
          .then(function () { return esperarPor(el, n); });
      });
    }

    function tomarUno() {
      if (siguiente >= elementos.length) return Promise.resolve();
      var el = elementos[siguiente++];

      return esperarPor(el, 0).then(function (ev) {
        if (estado.entidad !== enCurso || !ev) return;
        estado.evidencias[el.nombre] = ev;
        pintar();
        if (ev.hayCifras) pedirExplicacion(el);
      }).catch(function (err) {
        if (estado.entidad !== enCurso) return;
        estado.evidencias[el.nombre] = { hayCifras: false, error: err.message };
        pintar();
      }).then(tomarUno);
    }

    var frentes = [];
    for (var i = 0; i < Math.min(SIMULTANEAS, elementos.length); i++) frentes.push(tomarUno());
    return Promise.all(frentes);
  }

  /* ============ interpretación de un resultado ============ */

  /**
   * Clasifica el resultado para elegir color e icono. La frase clínica la
   * escribe siempre el servidor: aquí solo se decide cómo se presenta.
   */
  function claseVeredicto(d) {
    if (!d || !d.interpretable) return "nulo";
    if (d.detalle.magnitud.nivel === "irrelevante") return "nulo";
    var p = d.detalle.postTest;
    if (d.resultado === "positivo" && p >= 0.85) return "decide";
    if (d.resultado === "negativo" && p <= 0.10) return "decide";
    return "mueve";
  }

  function interpretarTest(nombre) {
    var hueco = salida.querySelector('[data-hueco="' + nombre.replace(/"/g, '\\"') + '"]');
    var ev = estado.evidencias[nombre];
    var resultado = estado.resultados[nombre];

    Array.prototype.forEach.call(salida.querySelectorAll('[data-marcar="' + nombre.replace(/"/g, '\\"') + '"]'), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-valor") === resultado));
    });

    if (!hueco) return;
    if (!resultado) { hueco.innerHTML = ""; refrescarConclusion(); return; }

    // Marcar siempre vale. Lo que cambia es cuánto podemos decirte del resultado.
    if (!estado.nivel) {
      hueco.innerHTML = veredictoSimple("nulo", "Anotado · falta tu sospecha",
        "Dinos arriba con cuánta sospecha llegabas y verás qué significa este resultado, y de paso el de todos los tests que ya hayas marcado.");
      refrescarConclusion();
      return;
    }

    // Aún buscando: decir "nadie lo ha publicado" sería afirmar algo que no se
    // sabe todavía. Al llegar las cifras la página se repinta y este mismo
    // resultado se interpreta solo.
    if (!ev) {
      hueco.innerHTML = veredictoSimple("aguarda", "Anotado · esperando las cifras",
        "Todavía estamos buscando la precisión publicada de este test. En cuanto llegue, verás aquí qué significa este resultado, sin tener que volver a marcarlo.");
      refrescarConclusion();
      return;
    }

    if (!ev.hayCifras) {
      hueco.innerHTML = veredictoSimple("nulo", "Anotado · sin cifras para interpretarlo",
        "Nadie ha publicado la precisión de este test para esta patología, así que no puede decirse cuánto cambia tu sospecha.");
      refrescarConclusion();
      return;
    }


    hueco.innerHTML = '<div class="veredicto"><div class="cargando"><span class="girando"></span>Calculando…</div></div>';

    pedir("/api/interpretar", {
      nivelPreTest: estado.nivel, sn: ev.sn, sp: ev.sp, resultado: resultado
    }).then(function (d) {
      if (estado.resultados[nombre] !== resultado) return;

      // Media cifra: no hay probabilidad, pero sí el techo de lo que puede dar.
      if (d.parcial) {
        if (!d.acotable) {
          hueco.innerHTML = veredictoSimple("nulo", "Anotado · no se puede acotar", d.motivo);
          refrescarConclusion();
          return;
        }

        var y = d.detalle;
        var claseP = y.magnitud.nivel === "irrelevante" ? "nulo" : "mueve";
        hueco.innerHTML =
          '<div class="veredicto ' + claseP + '">' +
            '<div class="veredicto-cab">' + icono(claseP) + "<b>" +
              (claseP === "nulo"
                ? "Ni en el mejor caso cambia gran cosa"
                : "Como mucho, " + (resultado === "positivo" ? "sube" : "baja") + " hasta el " + esc(y.postTestTexto)) +
            "</b></div>" +
            '<p class="lectura">' + esc(d.lectura) + "</p>" +
            lineaIa(nombre, resultado) +
            medidor(y.preTest, y.postTest, claseP === "nulo" ? "nulo" : "") +
            '<div class="calculo">' +
              "solo consta " + (y.falta === "especificidad" ? "la sensibilidad" : "la especificidad") +
              ", así que esto es un techo y no una cifra: la real queda entre tu sospecha de partida y ese " +
              esc(y.postTestTexto) +
            "</div>" +
          "</div>";

        animarCifras(hueco);
        refrescarConclusion();
        return;
      }

      if (!d.interpretable) {
        estado.interpretaciones[nombre] = d;
        hueco.innerHTML = veredictoSimple("nulo", "No interpretable", (d.problemas || []).join(" "));
        refrescarConclusion();
        return;
      }

      estado.interpretaciones[nombre] = d;

      var x = d.detalle;
      var clase = claseVeredicto(d);

      hueco.innerHTML =
        '<div class="veredicto ' + clase + '">' +
          '<div class="veredicto-cab">' + icono(clase) + "<b>" + esc(tituloVeredicto(clase, d)) + "</b></div>" +
          '<p class="lectura">' + esc(d.lectura) + "</p>" +
          lineaIa(nombre, resultado) +
          medidor(x.preTest, x.postTest, clase === "nulo" ? "nulo" : "") +
          '<div class="calculo">' +
            esc(x.preTestTexto) + "  →  RV " + esc(x.cual) + " " + num(x.razonDeVerosimilitud) +
            "  ·  " + esc(x.magnitud.texto) +
            (x.corregida
              ? "<br>precisión publicada del 100%: se calcula con 0,999 para no dar una certeza absoluta"
              : "") +
          "</div>" +
        "</div>";

      animarCifras(hueco);
      refrescarConclusion();
    }).catch(function (err) {
      if (estado.resultados[nombre] !== resultado) return;
      // Se anota como no interpretable para que la conclusión no se quede
      // esperando un cálculo que ya no va a llegar.
      estado.interpretaciones[nombre] = { interpretable: false, fallida: true };
      hueco.innerHTML = veredictoSimple("nulo", "No se ha podido calcular", err.message);
      refrescarConclusion();
    });
  }

  /**
   * El titular del cajetín dice hacia dónde va y cuánto, sin tener que leer
   * más. Antes eran etiquetas abstractas ("Decide", "Mueve tu sospecha") que
   * obligaban a bajar a la frase para saber si confirmaba o descartaba.
   */
  function tituloVeredicto(clase, d) {
    var x = d.detalle;
    var tramo = "del " + pct(x.preTest) + "% al " + x.postTestTexto;
    if (clase === "decide") return (d.resultado === "positivo" ? "Confirma" : "Descarta") + " · " + tramo;
    if (clase === "nulo") return "Apenas cambia nada · " + tramo;
    return (x.postTest > x.preTest ? "Sube tu sospecha" : "Baja tu sospecha") + " · " + tramo;
  }

  /** La línea redactada para este test y esta patología, si ha llegado y ha pasado el candado. */
  function lineaIa(nombre, resultado) {
    var exp = estado.explicaciones[nombre];
    var texto = exp && typeof exp === "object" ? exp[resultado] : null;
    if (!texto) return "";
    return '<p class="veredicto-ia">' + esc(texto) + "<small>Redactado con IA a partir de estas cifras</small></p>";
  }

  function veredictoSimple(clase, titulo, texto) {
    return '<div class="veredicto ' + clase + '">' +
      '<div class="veredicto-cab">' + icono(clase) + "<b>" + esc(titulo) + "</b></div>" +
      '<p class="lectura">' + esc(texto) + "</p>" +
    "</div>";
  }

  /* ============ conclusión final ============ */

  /**
   * La síntesis de la exploración.
   *
   * Lo que NO hace, y es deliberado: encadenar los resultados para dar una
   * probabilidad final. Tests que exploran la misma estructura no aportan
   * información independiente, y multiplicar sus razones de verosimilitud daría
   * una certeza que la evidencia no respalda. Sería el peor error posible aquí.
   *
   * Lo que sí hace: señalar cuál de los resultados que has obtenido es el que
   * de verdad decide, decirte cuáles has marcado sin que aporten nada, y
   * avisarte cuando tu propia exploración se contradice.
   */
  function sintesis() {
    var marcados = Object.keys(estado.resultados).filter(function (n) { return estado.resultados[n]; });
    if (!marcados.length) return { fase: "sin_marcar" };
    if (!estado.nivel) return { fase: "sin_nivel", marcados: marcados.length };

    var conCalculo = [];
    var sinCifras = [];
    var parciales = [];
    // Marcados con las dos cifras cuya interpretación aún no ha vuelto del
    // servidor. Sin contarlos, durante esos instantes la conclusión decía "nada
    // de lo explorado decide" y un momento después lo contrario.
    var calculando = 0;

    marcados.forEach(function (n) {
      var ev = estado.evidencias[n];
      var d = estado.interpretaciones[n];
      if (d && d.interpretable) conCalculo.push({ nombre: n, d: d });
      else if (ev && ev.hayCifras && ev.interpretable === false) parciales.push(n);
      else if (ev && !ev.hayCifras) sinCifras.push(n);
      else if (ev && ev.hayCifras && !d) calculando += 1;
      // Marcado antes de que llegaran sus cifras, que con la búsqueda en segundo
      // plano pasa: el fisioterapeuta hace el test cuando lo tiene delante, no
      // cuando termina PubMed. Hasta que lleguen, tampoco se sabe qué aporta.
      else if (!ev) calculando += 1;
    });

    // Fuerza de un resultado: cuánto se aleja de 1 su razón de verosimilitud,
    // en cualquiera de las dos direcciones.
    function fuerza(d) {
      var lr = d.detalle.razonDeVerosimilitud;
      return lr >= 1 ? lr : 1 / lr;
    }

    var utiles = conCalculo.filter(function (x) { return x.d.detalle.magnitud.nivel !== "irrelevante"; });
    var nulos = conCalculo.filter(function (x) { return x.d.detalle.magnitud.nivel === "irrelevante"; });

    var decisivo = null;
    utiles.forEach(function (x) { if (!decisivo || fuerza(x.d) > fuerza(decisivo.d)) decisivo = x; });

    // Discordancia: unos empujan hacia arriba y otros hacia abajo.
    var suben = utiles.filter(function (x) { return x.d.detalle.postTest > x.d.detalle.preTest; });
    var bajan = utiles.filter(function (x) { return x.d.detalle.postTest < x.d.detalle.preTest; });

    return {
      fase: "listo",
      marcados: marcados.length,
      calculando: calculando,
      decisivo: decisivo,
      utiles: utiles,
      nulos: nulos,
      sinCifras: sinCifras,
      parciales: parciales,
      discordante: suben.length > 0 && bajan.length > 0,
      suben: suben,
      bajan: bajan
    };
  }

  function listaNombres(ns) {
    return ns.map(function (n) { return esc(n); }).join(", ");
  }

  function refrescarConclusion() {
    var caja = document.getElementById("conclusion");
    if (!caja) return;

    var s = sintesis();

    if (s.fase === "sin_marcar") {
      // Antes la fase quedaba vacía. Ahora dice qué hace falta para llenarla, y
      // la próxima conclusión que aparezca vuelve a tener su llegada.
      ui.vistos.conclusion = false;
      caja.innerHTML = '<div class="fase-vacia">' +
        '<span class="fase-vacia-icono" aria-hidden="true"></span>' +
        "<div><b>Aún no hay nada que concluir</b>" +
        "<p>Marca Positivo o Negativo en cualquier test y aquí verás qué hace ese resultado con tu sospecha.</p></div>" +
      "</div>";
      actualizarCarril();
      return;
    }

    if (s.fase === "sin_nivel") {
      caja.innerHTML = '<div class="conclusion' + entradaConclusion() + '"><div class="conclusion-dentro">' +
        "<h2>Falta tu sospecha inicial</h2>" +
        '<p class="sumario">Has marcado ' + s.marcados + (s.marcados === 1 ? " resultado" : " resultados") +
        ", pero sin saber con cuánta sospecha llegabas no puede calcularse qué significan. " +
        "Márcala en la fase 1 y se interpretan todos de golpe.</p>" +
      "</div></div>";
      actualizarCarril();
      return;
    }

    // Si falta por llegar algún cálculo, no se reescribe: se deja lo que hubiera
    // hasta que esté. Afirmar "nada decide" con un resultado aún por calcular es
    // afirmar algo que no se sabe, aunque sea durante medio segundo.
    if (s.calculando) {
      // Si ya había una conclusión se deja quieta hasta que esté todo. Si no la
      // había, se dice que se está esperando: seguir enseñando "aún no hay nada
      // que concluir" con un resultado ya marcado parecería que no se ha visto.
      if (!caja.querySelector(".conclusion")) {
        caja.innerHTML = '<div class="fase-vacia">' +
          '<span class="fase-vacia-icono" aria-hidden="true"></span>' +
          "<div><b>Calculando…</b>" +
          "<p>Esperando las cifras de lo que has marcado. En cuanto lleguen, verás aquí qué hace con tu sospecha.</p></div>" +
        "</div>";
      }
      actualizarCarril();
      return;
    }

    var partes = [];

    if (!s.decisivo) {
      partes.push("<h2>Nada de lo explorado decide</h2>");
      partes.push('<p class="sumario">Has marcado ' + s.marcados +
        (s.marcados === 1 ? " resultado" : " resultados") +
        ", pero ninguno mueve tu sospecha lo suficiente como para cambiar tu decisión. " +
        "Sigues donde estabas.</p>");
    } else {
      var x = s.decisivo.d.detalle;
      var clase = claseVeredicto(s.decisivo.d);
      partes.push("<h2>" + esc(s.decisivo.d.lectura) + "</h2>");
      partes.push('<p class="sumario">De todo lo que has explorado, el resultado que más pesa es ' +
        "<b>" + esc(s.decisivo.nombre) + " " + esc(s.decisivo.d.resultado) + "</b>. " +
        "Es el que más mueve tu sospecha, y esto es lo que hace con ella:</p>");
      partes.push('<div class="conclusion-medidor">' + medidor(x.preTest, x.postTest, clase === "nulo" ? "nulo" : "") + "</div>");
    }

    var hitos = [];

    if (s.discordante) {
      hitos.push('<div class="hito alerta">' + icono("alerta") +
        "<span><b>Tus resultados no van en la misma dirección.</b> " +
        listaNombres(s.suben.map(function (x) { return x.nombre; })) + " apunta" + (s.suben.length > 1 ? "n" : "") + " a confirmar, " +
        "mientras que " + listaNombres(s.bajan.map(function (x) { return x.nombre; })) + " apunta" + (s.bajan.length > 1 ? "n" : "") + " a descartar. " +
        "Merece una segunda mirada antes de decidir.</span></div>");
    }

    if (s.nulos.length) {
      hitos.push('<div class="hito">' + icono("nulo") +
        "<span><b>" + s.nulos.length + (s.nulos.length === 1 ? " resultado no aporta" : " resultados no aportan") + " nada:</b> " +
        listaNombres(s.nulos.map(function (x) { return x.nombre; })) + ". " +
        "Su precisión publicada es tan pobre que salen igual con lesión y sin ella.</span></div>");
    }

    if (s.parciales.length) {
      hitos.push('<div class="hito">' + icono("info") +
        "<span><b>" + s.parciales.length + (s.parciales.length === 1 ? " resultado da un techo" : " resultados dan un techo") + ", no una cifra:</b> " +
        listaNombres(s.parciales) + ". Solo consta una de las dos precisiones, así que de esos sabemos lo más que pueden aportar, " +
        "pero no cuánto aportan. No entran en la conclusión.</span></div>");
    }

    if (s.sinCifras.length) {
      hitos.push('<div class="hito">' + icono("info") +
        "<span><b>" + s.sinCifras.length + (s.sinCifras.length === 1 ? " resultado no cuenta" : " resultados no cuentan") + ":</b> " +
        listaNombres(s.sinCifras) + ". Nadie ha publicado su precisión para esta patología.</span></div>");
    }

    if (hitos.length) partes.push('<div class="hitos">' + hitos.join("") + "</div>");

    partes.push('<p class="nota-cadena">Esta conclusión no encadena los resultados entre sí. ' +
      "Tests que exploran la misma estructura no aportan información independiente, y multiplicar " +
      "sus razones de verosimilitud daría una certeza que la evidencia no respalda. Lo que ves es " +
      "el resultado que más mueve tu sospecha, interpretado contra la sospecha con la que llegaste.</p>");

    caja.innerHTML = '<div class="conclusion' + entradaConclusion() + '"><div class="conclusion-dentro">' + partes.join("") + "</div></div>";
    animarCifras(caja);
    actualizarCarril();
  }

  /**
   * La conclusión se rehace con cada resultado marcado. Entra con su llegada la
   * primera vez y después se queda quieta: una tarjeta que vuelve a aparecer a
   * cada clic parece que se ha reiniciado.
   */
  function entradaConclusion() {
    if (ui.vistos.conclusion) return " ya";
    ui.vistos.conclusion = true;
    return " llega";
  }

  /* ============ el carril de pasos ============ */

  /* Informa, nunca bloquea. Se puede marcar un resultado antes de fijar la
     sospecha previa, y la herramienta lo permite a propósito. */

  var pasoActivo = 1;

  // El carril y las cabeceras leen el mismo estado. Si lo calcularan por
  // separado, un día el carril diría "hecho" y la fase "en curso".
  function estadoPasos() {
    return estadoFases().map(function (f) {
      return {
        titulo: f.titulo,
        valor: f.valorCarril || f.valor,
        detalle: f.detalle || null,
        hecho: f.estado === "hecha",
        // Es el paso que más gente se salta, y sin él no puede concluirse nada.
        pendiente: f.n === 1 && f.estado !== "hecha"
      };
    });
  }

  function actualizarCarril() {
    actualizarFases();
    if (!carril) return;

    if (!estado.tests.length) {
      carril.innerHTML = "";
      trabajo.classList.add("sin-carril");
      return;
    }
    trabajo.classList.remove("sin-carril");

    // Las banderas rojas quedan fuera de los números a propósito: un paso es
    // algo que se completa y se deja atrás, y esto es una vigilancia que
    // acompaña toda la exploración.
    var alerta = estado.banderas.length
      ? '<button class="alerta-banderas" data-ir-banderas>' +
          estado.banderas.length + " banderas rojas en " + esc(estado.region) +
        "</button>"
      : "";

    carril.innerHTML = alerta +
      '<ol class="pasos">' +
        estadoPasos().map(function (p, i) {
          return "<li>" +
            '<button class="paso-carril' + (p.hecho ? " hecho" : "") +
            (p.pendiente ? " pendiente" : "") +
            (pasoActivo === i + 1 ? " activo" : "") + '" data-paso="' + (i + 1) + '">' +
            '<span class="paso-num"><span>' + (i + 1) + "</span></span>" +
            '<span class="paso-texto"><b>' + p.titulo + "</b>" +
            '<span class="paso-valor">' + esc(p.valor) + "</span>" +
            (p.detalle ? '<span class="paso-detalle" title="' + esc(p.detalle) + '">' + esc(p.detalle) + "</span>" : "") +
            "</span></button></li>";
        }).join("") +
      "</ol>";

    Array.prototype.forEach.call(carril.querySelectorAll("[data-paso]"), function (b) {
      b.addEventListener("click", function () {
        var destino = document.getElementById("paso-" + b.getAttribute("data-paso"));
        if (destino) destino.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    var aBanderas = carril.querySelector("[data-ir-banderas]");
    if (aBanderas) {
      aBanderas.addEventListener("click", abrirBanderas);
    }
  }

  /** Qué paso mira el fisioterapeuta ahora mismo, según por dónde va la página. */
  function pasoSegunScroll() {
    var referencia = window.innerHeight * 0.35;
    var actual = 1;
    for (var n = 1; n <= 3; n++) {
      var el = document.getElementById("paso-" + n);
      if (el && el.getBoundingClientRect().top <= referencia) actual = n;
    }
    return actual;
  }

  function marcarPasoActivo() {
    Array.prototype.forEach.call(carril.querySelectorAll("[data-paso]"), function (b) {
      b.classList.toggle("activo", Number(b.getAttribute("data-paso")) === pasoActivo);
    });
  }

  var pendiente = false;
  window.addEventListener("scroll", function () {
    if (pendiente || !estado.tests.length) return;
    pendiente = true;
    requestAnimationFrame(function () {
      pendiente = false;
      var ahora = pasoSegunScroll();
      if (ahora !== pasoActivo) { pasoActivo = ahora; marcarPasoActivo(); }
    });
  }, { passive: true });

  /* ============ últimas consultas ============ */

  /* Solo en el navegador del fisioterapeuta. Qué patologías consulta es un dato
     con carga sanitaria y no hay razón para que salga de su dispositivo.
     De regalo, repetir una suya sale de la caché: instantánea y sin coste. */

  var CLAVE_RECIENTES = "fisioia.recientes";
  var MAX_RECIENTES = 6;

  function recientes() {
    try { return JSON.parse(localStorage.getItem(CLAVE_RECIENTES)) || []; } catch (e) { return []; }
  }

  function recordar(sospecha) {
    var lista = recientes().filter(function (x) { return x.toLowerCase() !== sospecha.toLowerCase(); });
    lista.unshift(sospecha);
    try { localStorage.setItem(CLAVE_RECIENTES, JSON.stringify(lista.slice(0, MAX_RECIENTES))); } catch (e) {}
  }

  function pintarRecientes() {
    var caja = document.getElementById("recientes");
    var lista = recientes();
    if (!caja || !lista.length) { if (caja) caja.hidden = true; return; }

    document.getElementById("recientes-lista").innerHTML = lista.map(function (x) {
      return '<button class="reciente" data-ej="' + esc(x) + '">' + esc(x) + "</button>";
    }).join("");
    caja.hidden = false;

    Array.prototype.forEach.call(caja.querySelectorAll("[data-ej]"), function (b) {
      b.addEventListener("click", function () {
        campo.value = b.getAttribute("data-ej");
        consultar(campo.value);
      });
    });
  }

  pintarRecientes();

})();
</script>
